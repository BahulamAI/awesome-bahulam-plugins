apiVersion: bahulam.plugin/1
kind: Plugin
metadata:
  name: content-creation
  version: 0.1.0
  description: >
    Content creation runtime for campaigns, explainers, demos, and social
    assets. The director coordinates briefs, image/video generation records,
    Three.js interactive scenes, Manim explainers, background renders, review,
    and a live artifact gallery. Manim remains one substrate inside the broader
    content workflow.
  author: BahulamAI
  repository: https://github.com/BahulamAI/awesome-bahulam-plugins

config:
  tools:
    - name: content_brief
      description: >
        Create a structured content brief for an asset package: audience,
        objective, channels, formats, visual direction, and acceptance criteria.
        The brief is persisted to the plugin blackboard so image, video,
        Three.js, and Manim assets stay tied to one campaign/objective.
      tool: ./tools/content-brief.mjs
      parameters:
        type: object
        properties:
          name: { type: string, description: "Lowercase package slug, e.g. launch-thread." }
          objective: { type: string }
          audience: { type: string }
          channels:
            type: array
            items: { type: string }
          formats:
            type: array
            items: { type: string, enum: [image, video, threejs, manim, copy] }
          style: { type: string, description: "Visual and voice direction." }
          acceptance: { type: string, description: "What must be true before the package is done." }
        required: [name, objective, audience]

    - name: record_asset
      description: >
        Record an image, video, Three.js scene, Manim render, copy deck, or
        other content artifact in the shared gallery state. Use this after
        generate_image/generate_video/Three.js/Manim work so the UI and future
        agents can find the outcome.
      tool: ./tools/record-asset.mjs
      parameters:
        type: object
        properties:
          name: { type: string }
          kind: { type: string, enum: [image, video, threejs, manim, copy, report] }
          path: { type: string }
          prompt: { type: string }
          status: { type: string, enum: [draft, approved, rejected, published, failed] }
          notes: { type: string }
        required: [name, kind, status]

    - name: write_threejs_scene
      description: >
        Write a self-contained Three.js HTML scene artifact for interactive
        product explainers, landing-page embeds, or social demos. The tool
        records the generated file in the plugin artifact gallery.
      tool: ./tools/write-threejs-scene.mjs
      parameters:
        type: object
        properties:
          name: { type: string, description: "Lowercase scene slug." }
          title: { type: string }
          script: { type: string, description: "Narrative or scene direction to include in metadata." }
          html: { type: string, description: "Complete HTML document. If omitted, a starter Three.js scene is generated." }
        required: [name]

    - name: render_scene
      description: >
        Manim substrate render tool. Writes a Manim CE scene to
        content-creation/renders/<slug>/{scene.py, manifest.json[, script.md]}
        so the source, storyboard, manifest, and eventually the rendered
        video all live in one folder — inspectable from a plain file
        browser. Shared reusable code lives one level up under
        content-creation/assets/ (colors.py, fonts.yaml, helpers/, templates/)
        and can be imported from scene.py.

        OSS behavior (this impl): saves the files, records a manifest,
        and returns the manim CLI command for the agent to launch via
        `shell run_in_background`. Hosted/SaaS implementations can expose the
        same tool contract through MCP/Context Forge and run on managed render
        infrastructure — same tool name + params, different substrate. See
        config/README.md.
      tool: ./tools/render-scene.mjs
      parameters:
        type: object
        properties:
          name:
            type: string
            description: "Slug for this scene (e.g. compound-interest). Used for the render folder and video names."
          scene_class:
            type: string
            description: "The Python class name of the Scene (e.g. CompoundInterest)."
          code:
            type: string
            description: "Complete Manim CE Python source. Must define exactly the scene_class given. May import from content-creation/assets/."
          quality:
            type: string
            enum: [l, m, h]
            description: "Render quality: l=480p (fast drafts), m=720p (default), h=1080p."
          title:
            type: string
            description: "Optional human-readable title for the render. Defaults to the slug."
          script:
            type: string
            description: "Optional approved storyboard/brief markdown. Persisted next to scene.py as script.md."
        required: [name, scene_class, code]

    - name: register_render
      description: >
        Record a completed (or failed) render on the plugin's shared
        blackboard — the workspace gallery lists renders from here. The
        render-reviewer calls this after inspecting a finished job.
      tool: ./tools/register-render.mjs
      parameters:
        type: object
        properties:
          name:         { type: string, description: "Scene slug" }
          scene_class:  { type: string }
          status:       { type: string, enum: [completed, failed, fixed_and_rerendered] }
          video_path:   { type: string, description: "Path to the rendered .mp4 (empty when failed)" }
          duration_s:   { type: number, description: "Render wall-clock seconds" }
          notes:        { type: string, description: "Reviewer verdict — one or two lines" }
        required: [name, status]

    - name: list_renders
      description: List saved Manim scenes and completed/failed renders from the shared blackboard, newest first.
      tool: ./tools/list-renders.mjs
      parameters:
        type: object
        properties:
          limit: { type: integer, description: "Max rows (default 20)" }
        required: []

    - name: list_assets
      description: List content briefs and recorded assets from the shared gallery state.
      tool: ./tools/list-assets.mjs
      parameters:
        type: object
        properties:
          limit: { type: integer, description: "Max rows (default 50)" }
        required: []

  # Entry/primary agent — the workspace's front door. Mirrors SaaS's
  # workspace.yaml convention so codekepler-backend can consume the
  # same file directly via git submodule. The director agent that
  # orchestrates the plan → animator → reviewer chain.
  workspace: ./config/workspace.yaml

  # Sub-agents the director delegates to. Auto-loaded by the CLI
  # manifest loader (see codekepler-npm PR #20).
  agents_from: ./config/agents/

  views:
    - type: panel
      name: Content Creation
      source: ./workspace/studio.html
