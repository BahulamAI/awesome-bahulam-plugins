apiVersion: bahulam.plugin/1
kind: Plugin
metadata:
  name: excalidraw-spec
  version: 1.0.0
  description: >
    Reads a repository folder and draws its architecture. A deterministic
    scanner walks the tree and extracts real import edges, so the graph is
    evidence rather than a guess; the agent then names layers and groups. The
    result is rendered in a whiteboard panel and exported as a genuine
    .excalidraw document, a Mermaid diagram, or a Markdown architecture spec
    for onboarding.
  author: BahulamAI
  repository: https://github.com/BahulamAI/awesome-bahulam-plugins

config:
  # ── Declared state (the GRAPH) ──────────────────────────────────────
  # What is declared here is the architecture itself: repos, the nodes that
  # make them up, and the edges between them. The plotted scene is NOT stored
  # — it is computed from this graph on demand, so re-labelling or re-laying
  # out never has to migrate a blob of renderer state.
  #
  #   tables          created on open, migrated additively on version bump
  #   context_always  injected into the agent context every turn
  #   context_tools   auto-generated read-only tools the agent can call
  state:
    tables:
      - name: repos
        columns:
          - { name: id, type: INTEGER, primary: true, autoincrement: true }
          - { name: name, type: TEXT, not_null: true }
          - { name: root_path, type: TEXT, not_null: true }
          - { name: root_label, type: TEXT, not_null: true }
          - { name: file_count, type: INTEGER, not_null: true, default: "0" }
          - { name: source_file_count, type: INTEGER, not_null: true, default: "0" }
          - { name: total_loc, type: INTEGER, not_null: true, default: "0" }
          - { name: languages, type: TEXT, not_null: true, default: "'{}'" }
          - { name: entry_points, type: TEXT, not_null: true, default: "'[]'" }
          - { name: skipped_count, type: INTEGER, not_null: true, default: "0" }
          - { name: scanned_at, type: TEXT, not_null: true }
          - { name: created_at, type: TEXT, not_null: true }
          - { name: updated_at, type: TEXT, not_null: true }
        indexes:
          - { columns: [name], unique: true }

      # One row per architectural box. `kind` and `layer` start as deterministic
      # guesses (directory depth, entry-point heuristics) and the agent sharpens
      # them; keeping both means "what the scanner saw" never gets overwritten
      # by "what the model decided".
      - name: nodes
        columns:
          - { name: id, type: INTEGER, primary: true, autoincrement: true }
          - { name: repo_id, type: INTEGER, not_null: true, references: "repos(id)" }
          - { name: node_key, type: TEXT, not_null: true }
          - { name: label, type: TEXT, not_null: true }
          - { name: detail, type: TEXT }
          - { name: kind, type: TEXT, not_null: true, default: "'module'" }
          - { name: layer, type: TEXT }
          - { name: layer_index, type: INTEGER, not_null: true, default: "0" }
          - { name: source_path, type: TEXT, not_null: true }
          - { name: file_count, type: INTEGER, not_null: true, default: "0" }
          - { name: loc, type: INTEGER, not_null: true, default: "0" }
          - { name: languages, type: TEXT, not_null: true, default: "'[]'" }
          - { name: external_deps, type: TEXT, not_null: true, default: "'[]'" }
          - { name: is_entry, type: INTEGER, not_null: true, default: "0" }
          - { name: is_external, type: INTEGER, not_null: true, default: "0" }
          - { name: sort_order, type: INTEGER, not_null: true, default: "0" }
          - { name: created_at, type: TEXT, not_null: true }
          - { name: updated_at, type: TEXT, not_null: true }
        indexes:
          - { columns: [repo_id, node_key], unique: true }
          - { columns: [repo_id] }
          - { columns: [repo_id, layer_index] }

      # The dependency edges. `weight` is how many imports cross this boundary,
      # which is what turns a hairball into a readable diagram.
      - name: edges
        columns:
          - { name: id, type: INTEGER, primary: true, autoincrement: true }
          - { name: repo_id, type: INTEGER, not_null: true, references: "repos(id)" }
          - { name: from_key, type: TEXT, not_null: true }
          - { name: to_key, type: TEXT, not_null: true }
          - { name: kind, type: TEXT, not_null: true, default: "'import'" }
          - { name: label, type: TEXT }
          - { name: weight, type: INTEGER, not_null: true, default: "1" }
          - { name: created_at, type: TEXT, not_null: true }
        indexes:
          - { columns: [repo_id, from_key, to_key], unique: true }
          - { columns: [repo_id] }

      # Render history. The scene itself is generated, never stored — this is
      # the record of what was exported, so a spec doc can be traced to the
      # graph state that produced it.
      - name: exports
        columns:
          - { name: id, type: INTEGER, primary: true, autoincrement: true }
          - { name: repo_id, type: INTEGER, not_null: true, references: "repos(id)" }
          - { name: format, type: TEXT, not_null: true }
          - { name: layout, type: TEXT, not_null: true, default: "'layered'" }
          - { name: node_count, type: INTEGER, not_null: true, default: "0" }
          - { name: edge_count, type: INTEGER, not_null: true, default: "0" }
          - { name: element_count, type: INTEGER, not_null: true, default: "0" }
          - { name: byte_size, type: INTEGER, not_null: true, default: "0" }
          - { name: created_at, type: TEXT, not_null: true }
        indexes:
          - { columns: [repo_id] }
          - { columns: [repo_id, created_at] }

    # ── Tier 1: injected every turn ─────────────────────────────────
    # Six numbers about the SCAN, never a node or a row of source. A returning
    # session knows which repository it was drawing without paying to re-read
    # the whole graph on every turn.
    context_always:
      - board_state                     # { active_repo, repo_id, nodes, edges, exported }
      - { stream: board_log, limit: 3 }

    # ── Tier 2: generated read-only tools ───────────────────────────
    # Graph reads only. These reach DECLARED tables, so the full node list is
    # fetched deliberately rather than injected automatically.
    context_tools:
      - name: list_repos
        table: repos
        description: >
          List the repositories that have been scanned, with their file and
          line counts, detected languages and entry points. Read-only.
        parameters:
          type: object
          properties:
            limit:
              type: integer
              description: "Max rows to return (default 50)."

      - name: list_nodes
        table: nodes
        description: >
          List the architectural nodes of a scanned repository: the label, what
          kind of box it is, its layer, and how many files and lines it holds.
          Read-only.
        parameters:
          type: object
          properties:
            repo_id:
              type: integer
              description: "The repository whose nodes you want."
            limit:
              type: integer
              description: "Max rows to return (default 200)."
        where: "repo_id = ?"
        params: [repo_id]

      - name: list_edges
        table: edges
        description: >
          List the dependency edges between nodes, with the import weight that
          makes some boundaries load-bearing and others incidental. Read-only.
        parameters:
          type: object
          properties:
            repo_id:
              type: integer
              description: "The repository whose edges you want."
            limit:
              type: integer
              description: "Max rows to return (default 500)."
        where: "repo_id = ?"
        params: [repo_id]

      - name: list_exports
        table: exports
        description: >
          List past exports for a repository: format, layout, how many boxes
          and arrows the scene had, and when it was produced. Read-only.
        parameters:
          type: object
          properties:
            repo_id:
              type: integer
              description: "The repository whose export history you want."
            limit:
              type: integer
              description: "Max rows to return (default 50)."
        where: "repo_id = ?"
        params: [repo_id]

  # ── Tools (the scan and render side) ───────────────────────────────
  # The generated tools above only READ the graph. Everything that walks a
  # tree, parses imports, computes a layout or emits a scene is a module,
  # because it is real logic, not a row fetch.
  tools:
    - name: scan_repository
      description: >
        Walk a repository folder and build its architecture graph: files grouped
        into modules, real import edges between them, detected languages, entry
        points and external dependencies. Re-scanning the same path replaces
        the graph for that repo. Nothing is inferred by a model here — this is
        deterministic evidence the rest of the plugin draws.
      tool: ./tools/scan-repository.mjs
      parameters:
        type: object
        properties:
          path:
            type: string
            description: "Path to the repository root to scan."
          name:
            type: string
            description: "Repository name. Defaults to the folder name."
          group_depth:
            type: integer
            description: "How many path segments make one box (default 2, so src/core is a box)."
          max_files:
            type: integer
            description: "Stop after this many files (default 20000)."
          exclude:
            type: array
            items: { type: string }
            description: "Extra directory names to skip, on top of the built-in list."
        required: [path]

    - name: annotate_architecture
      description: >
        Set the human-facing meaning on scanned nodes: rename a box, assign it a
        layer, mark it as an entry point, service, store or data model, and add
        a one-line description. This is where the agent adds judgement on top of
        the scanner's evidence. Only the fields you pass are changed.
      tool: ./tools/annotate-architecture.mjs
      parameters:
        type: object
        properties:
          repo_id:
            type: integer
            description: "The repository whose nodes you are annotating."
          nodes:
            type: array
            minItems: 1
            description: "One entry per node to change."
            items:
              type: object
              properties:
                node_key:
                  type: string
                  description: "The node to change, e.g. src/core (see list_nodes)."
                label:
                  type: string
                  description: "Human-friendly box title."
                detail:
                  type: string
                  description: "One line on what this node is responsible for."
                kind:
                  type: string
                  enum: [entry, service, module, store, model, adapter, ui, util, external]
                  description: "What kind of box this is."
                layer:
                  type: string
                  description: "Layer name used for grouping, e.g. Runtime, Interface."
              required: [node_key]
        required: [repo_id, nodes]

    - name: arrange_diagram
      description: >
        Compute and store the layout order of a repository's nodes: dependencies
        point left to right, and boxes are stacked inside their layer. Run this
        after annotating, so renamed boxes are re-measured. Deterministic — the
        same graph always produces the same arrangement.
      tool: ./tools/arrange-diagram.mjs
      parameters:
        type: object
        properties:
          repo_id:
            type: integer
            description: "The repository to arrange."
          layout:
            type: string
            enum: [layered, grid]
            description: "layered follows dependencies left to right; grid is a plain packed grid. Defaults to layered."
          direction:
            type: string
            enum: [horizontal, vertical]
            description: "Which way dependencies point. Defaults to horizontal."
        required: [repo_id]

    - name: export_diagram
      description: >
        Render the architecture and return it as a keepable artifact. Choose
        excalidraw for a real .excalidraw file that opens in Excalidraw, mermaid
        for a text diagram that renders in a Markdown viewer, markdown for a
        full architecture spec document with the diagram and a node table, or
        json for the raw scene. Deterministic: two exports of the same graph are
        byte-identical.
      tool: ./tools/export-diagram.mjs
      parameters:
        type: object
        properties:
          repo_id:
            type: integer
            description: "The repository to render."
          format:
            type: string
            enum: [excalidraw, mermaid, markdown, json]
            description: "Artifact format. Defaults to excalidraw."
          layout:
            type: string
            enum: [layered, grid]
            description: "Layout to render with. Defaults to the stored arrangement."
          min_weight:
            type: integer
            description: "Drop edges lighter than this, to de-clutter a busy graph. Defaults to 1."
        required: [repo_id]

    - name: get_architecture
      description: >
        Summarise a repository's architecture as structured data: the boxes by
        layer with their sizes, the heaviest dependencies between them, the
        entry points, and the most-used external packages. Use this to read the
        graph without pulling every node and edge.
      tool: ./tools/get-architecture.mjs
      parameters:
        type: object
        properties:
          repo_id:
            type: integer
            description: "The repository to summarise."
          top_edges:
            type: integer
            description: "How many of the heaviest dependencies to return (default 25)."
          top_externals:
            type: integer
            description: "How many external packages to return (default 15)."
        required: [repo_id]

  # Entry agent — the architect the user talks to.
  workspace: ./config/workspace.yaml

  # Sub-agents the entry agent delegates to. Auto-loaded by the CLI manifest
  # loader; each file is a SubAgent declaration.
  agents_from: ./config/agents/

  # ── Workspace view ──────────────────────────────────────────────────
  # The whiteboard: the plotted architecture, the node inspector, the
  # dependency table and the export controls. Renders the scene locally from
  # the same graph the tools emit, so what you see and what you export agree.
  views:
    - type: panel
      name: Excalidraw Spec
      source: ./workspace/index.html
