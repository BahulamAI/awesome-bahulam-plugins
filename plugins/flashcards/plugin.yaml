apiVersion: bahulam.plugin/1
kind: Plugin
metadata:
  name: flashcards
  version: 1.0.0
  description: >
    Turns a document or a bare topic into flashcards, then keeps them
    reviewable. Cards live in declared SQLite tables with an SM-2 schedule
    (ease factor, interval, due date), so "what is due today" is a query
    rather than a note. A new session opens already knowing the deck, the
    backlog and the streak — no re-importing, no re-teaching. Reference
    implementation of `config.state`: tables + context_always + context_tools.
  author: BahulamAI
  repository: https://github.com/BahulamAI/awesome-bahulam-plugins

config:
  # ── Declared state ──────────────────────────────────────────────────
  # Three tiers, all driven from this block:
  #
  #   tables          created on open, migrated additively on version bump
  #   context_always  injected into the agent context every turn
  #   context_tools   auto-generated read-only tools the agent can call
  #
  # Anything NOT declared here stays private to the plugin's own tool
  # modules via `state.query()`. That is the third tier, and it is where
  # every write lives (see config.tools below).
  state:
    tables:
      - name: decks
        columns:
          - { name: id, type: INTEGER, primary: true, autoincrement: true }
          - { name: name, type: TEXT, not_null: true }
          - { name: description, type: TEXT }
          - { name: source_type, type: TEXT, not_null: true, default: "'topic'" }
          - { name: source_ref, type: TEXT }
          - { name: archived, type: INTEGER, not_null: true, default: "0" }
          - { name: created_at, type: TEXT, not_null: true }
          - { name: updated_at, type: TEXT, not_null: true }
        indexes:
          - { columns: [name], unique: true }
          - { columns: [archived] }

      # The schedule lives on the card, not in a side table, so "what is
      # due" is one indexed scan instead of a join per question.
      - name: cards
        columns:
          - { name: id, type: INTEGER, primary: true, autoincrement: true }
          - { name: deck_id, type: INTEGER, not_null: true, references: "decks(id)" }
          - { name: question, type: TEXT, not_null: true }
          - { name: answer, type: TEXT, not_null: true }
          - { name: explanation, type: TEXT }
          - { name: tags, type: TEXT }
          - { name: source_ref, type: TEXT }
          - { name: ease_factor, type: REAL, not_null: true, default: "2.5" }
          - { name: interval_days, type: INTEGER, not_null: true, default: "0" }
          - { name: due_at, type: TEXT, not_null: true, default: "'1970-01-01T00:00:00.000Z'" }
          - { name: reps, type: INTEGER, not_null: true, default: "0" }
          - { name: lapses, type: INTEGER, not_null: true, default: "0" }
          - { name: last_rating, type: INTEGER }
          - { name: last_reviewed_at, type: TEXT }
          - { name: created_at, type: TEXT, not_null: true }
          - { name: updated_at, type: TEXT, not_null: true }
        indexes:
          - { columns: [deck_id] }
          - { columns: [due_at] }
          - { columns: [deck_id, due_at] }

      # Immutable history. The cards table is the current schedule; this is
      # the ledger that makes "why is this card at 34 days?" answerable.
      - name: reviews
        columns:
          - { name: id, type: INTEGER, primary: true, autoincrement: true }
          - { name: card_id, type: INTEGER, not_null: true, references: "cards(id)" }
          - { name: rating, type: INTEGER, not_null: true }
          - { name: previous_interval_days, type: INTEGER, not_null: true }
          - { name: new_interval_days, type: INTEGER, not_null: true }
          - { name: previous_ease_factor, type: REAL, not_null: true }
          - { name: new_ease_factor, type: REAL, not_null: true }
          - { name: response_time_ms, type: INTEGER }
          - { name: note, type: TEXT }
          - { name: reviewed_at, type: TEXT, not_null: true }
        indexes:
          - { columns: [card_id] }
          - { columns: [reviewed_at] }

    # ── Tier 1: injected every turn ─────────────────────────────────
    # Small and high-signal. This is the part that puts a returning
    # session straight back into the backlog instead of making the learner
    # restate what they were studying. Every byte here is paid for on
    # every single turn, so nothing else belongs in it.
    context_always:
      - study_progress                     # { active_deck, deck_id, due_now, new_cards, streak }
      - { stream: study_log, limit: 3 }

    # ── Tier 2: generated read-only tools ───────────────────────────
    # No tools/*.mjs module needed — the CLI builds these from the table
    # plus the WHERE binding. `params` lists, in order, which arguments
    # bind to the `?` placeholders in `where`. A filter is applied only
    # when its argument is actually supplied, so omitting `as_of` lists
    # the whole bank rather than returning nothing.
    context_tools:
      - name: list_decks
        table: decks
        description: >
          List flashcard decks. Pass `archived` as 0 for the active decks or
          1 for ones that have been put away; omit it to list every deck.
          Read-only.
        parameters:
          type: object
          properties:
            archived:
              type: integer
              description: "0 for active decks, 1 for archived. Omit for every deck."
            limit:
              type: integer
              description: "Max rows to return (default 50)."
        where: "archived = ?"
        params: [archived]

      - name: list_cards
        table: cards
        description: >
          List cards from the bank. Returns the full schedule (ease_factor,
          interval_days, due_at, reps, lapses) so you can see what is
          coming up. Pass `deck_id` to narrow to one deck. Read-only.
        parameters:
          type: object
          properties:
            deck_id:
              type: integer
              description: "Only return cards from this deck. Omit for all decks."
            limit:
              type: integer
              description: "Max rows to return (default 50)."
        where: "deck_id = ?"
        params: [deck_id]

      - name: list_due_cards
        table: cards
        description: >
          List cards due at or before a timestamp. Pass the current UTC time
          as `as_of` to get the queue to study now. Read-only.
        parameters:
          type: object
          properties:
            as_of:
              type: string
              description: "ISO UTC timestamp; cards due at or before it are returned."
            limit:
              type: integer
              description: "Max rows to return (default 50)."
        where: "due_at <= ?"
        params: [as_of]

      - name: list_reviews
        table: reviews
        description: >
          List the review history for one card — how it was graded, and how
          the interval and ease factor moved each time. Read-only.
        parameters:
          type: object
          properties:
            card_id:
              type: integer
              description: "The card whose history you want."
            limit:
              type: integer
              description: "Max rows to return (default 50)."
        where: "card_id = ?"
        params: [card_id]

  # ── Tools (the write side) ──────────────────────────────────────────
  # The generated tools above only READ. Everything that writes — or that
  # needs real logic like the SM-2 schedule maths and the aggregate report —
  # is a normal tool module using `state.query()` directly.
  tools:
    - name: create_deck
      description: >
        Create a deck and make it the active one. Call this before adding
        cards — every card belongs to a deck. Fails if the name is already
        in use, comparing case-insensitively.
      tool: ./tools/create-deck.mjs
      parameters:
        type: object
        properties:
          name:
            type: string
            description: "Deck name, e.g. 'HTTP caching'. Unique, compared case-insensitively."
          description:
            type: string
            description: "Optional one-line note about what this deck covers."
          source_type:
            type: string
            enum: [topic, document, mixed]
            description: "Where the material came from. Defaults to topic."
          source_ref:
            type: string
            description: "The topic name, or the document path, this deck was built from."
        required: [name]

    - name: bulk_add_cards
      description: >
        Add a batch of Q&A cards to a deck in one call. Use this after
        generating cards from a topic or a document. Every card is validated
        before anything is written, so a malformed batch cannot leave the
        deck half-imported.
      tool: ./tools/bulk-add-cards.mjs
      parameters:
        type: object
        properties:
          deck_id:
            type: integer
            description: "Deck to add to (from create_deck or list_decks)."
          cards:
            type: array
            minItems: 1
            maxItems: 200
            description: "The cards to add. Maximum 200 per call."
            items:
              type: object
              properties:
                question:
                  type: string
                  description: "The prompt shown to the learner."
                answer:
                  type: string
                  description: "The expected answer. Keep it short and canonical."
                explanation:
                  type: string
                  description: "Optional note shown after the answer is revealed."
                tags:
                  type: array
                  items: { type: string }
                  description: "Optional tags for grouping."
                source_ref:
                  type: string
                  description: "Optional pointer back to the source (section, page, URL)."
              required: [question, answer]
        required: [deck_id, cards]

    - name: record_review
      description: >
        Grade one card and reschedule it. Applies the SM-2 rule: ratings 0-2
        are a lapse (interval back to one day, ease factor down by 0.2),
        ratings 3-5 grow the interval (1 day, then 6, then interval x ease
        factor). The ease factor is never allowed below 1.3.
      tool: ./tools/record-review.mjs
      parameters:
        type: object
        properties:
          card_id:
            type: integer
            description: "The card being graded."
          rating:
            type: integer
            minimum: 0
            maximum: 5
            description: "0-2 = failed recall, 3 = hard, 4 = good, 5 = easy."
          response_time_ms:
            type: integer
            description: "Optional: how long the learner took, in milliseconds."
          note:
            type: string
            description: "Optional note about why this rating."
        required: [card_id, rating]

    - name: reset_card
      description: >
        Put a card back to brand-new: clears its schedule and counters so it
        is due immediately. Review history is kept. Use this when a card is
        WRONG, not when it was merely forgotten.
      tool: ./tools/reset-card.mjs
      parameters:
        type: object
        properties:
          card_id:
            type: integer
            description: "The card to reset."
        required: [card_id]

    - name: update_deck
      description: >
        Rename, re-describe or archive a deck. Archiving keeps the cards and
        the review history and only drops the deck out of the study queue —
        use it to put a finished deck away rather than deleting it.
      tool: ./tools/update-deck.mjs
      parameters:
        type: object
        properties:
          deck_id:
            type: integer
            description: "The deck to change."
          name:
            type: string
            description: "New deck name. Must not collide with another deck."
          description:
            type: string
            description: "New one-line note. Pass an empty string to clear it."
          archived:
            type: integer
            minimum: 0
            maximum: 1
            description: "1 to put the deck away, 0 to bring it back."
        required: [deck_id]

    - name: get_study_stats
      description: >
        Summarise study state: how many cards exist, how many are due now or
        within a week, how many have never been seen, the rating mix, the
        average ease factor, and retention. Use this when asked how studying
        is going.
      tool: ./tools/get-study-stats.mjs
      parameters:
        type: object
        properties:
          deck_id:
            type: integer
            description: "Restrict the report to one deck. Omit for everything."
        required: []

  # Entry agent — the tutor the learner talks to.
  workspace: ./config/workspace.yaml

  # Sub-agents the tutor delegates to. Auto-loaded by the CLI manifest
  # loader; each file is a SubAgent declaration.
  agents_from: ./config/agents/

  # ── Workspace view ──────────────────────────────────────────────────
  # The study console: the flip surface, deck browser, due queue, stats and
  # the write forms — all reading the same state.db the tutor writes to.
  # Rendered as a central-panel tab; it calls the plugin's own tools through
  # POST /api/tools/execute using the token in the iframe URL, and repaints
  # itself from /api/events whenever the agent grades something in the chat.
  views:
    - type: panel
      name: Flashcards
      source: ./workspace/index.html
