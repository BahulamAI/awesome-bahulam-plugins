<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Document Writer</title>
<meta name="bahulam-plugin" content="document-writer">
<link rel="stylesheet" href="/vendor/bahulam-plugin/bahulam-plugin.css">
</head>
<body>
<div class="plugin-page">
<header class="plugin-bar"><span class="brand-mark">B</span><h1>Document Writer</h1><span class="live-badge js-live">· connecting…</span></header>
<div class="plugin-body">
<div id="empty" class="empty" style="display:none">
  No research documents yet.<br>
  <small>Ask the director to create one — e.g. "draft a NeurIPS paper on X from these PDFs".</small>
</div>
<div id="docs"></div>
</div>
</div>
<script>
var token=new URLSearchParams(location.search).get('token')||'',PLUGIN='document-writer';
function esc(s){return String(s??'').replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
function wcClass(a,t){if(!t)return'';var r=a/t;return r<0.5?'muted':r>1.5?'muted':'success'}
function claimBadge(c,u){if(!c)return'';var cls=u?'warn':'success';return'<span class="badge '+cls+'">'+c+' claims'+(u?' ('+u+' unverified)':' ok')+'</span>'}
async function fetchDocs(){try{var r=await fetch('/api/plugin-state/'+PLUGIN,{method:'POST',headers:{'Content-Type':'application/json','X-Bahulam-Local-Token':token},body:JSON.stringify({op:'list',stream:'documents',limit:50})});if(!r.ok)return[];var b=await r.json(),list=b?.result??[],seen=new Set;return list.filter(function(x){var s=x.slug||x.name;if(!s||seen.has(s))return false;seen.add(s);return true})}catch(e){return[]}}
async function load(){var rows=await fetchDocs();var empty=document.getElementById('empty'),docs=document.getElementById('docs');if(!rows.length){empty.style.display='';docs.innerHTML='';return}empty.style.display='none';docs.innerHTML=rows.map(function(r){var slug=r.slug||r.name,title=r.title||slug,kind=r.kind||'',venue=r.venue||'',wc=r.word_count||0,created=r.created_at?new Date(r.created_at).toLocaleString():'';return'<div class="card"><div class="flex items-center justify-between gap-1"><div class="meta">'+(kind?'<span class="badge teal">'+esc(kind)+'</span> ':'')+(venue?'<span class="badge">'+esc(venue)+'</span> ':'')+(created?'<span class="small muted">'+esc(created)+'</span>':'')+'</div></div><h3 style="margin-top:6px">'+esc(title)+' <code class="muted" style="font-size:11px">'+esc(slug)+'</code></h3><div class="stats-row"><span><b>'+wc+'</b> words'+(r.target_words?' / '+r.target_words:'')+'</span>'+(r.sections_count?'<span><b>'+r.sections_count+'</b> sections</span>':'')+(r.sources_count?'<span><b>'+r.sources_count+'</b> sources</span>':'')+(r.refs_count?'<span><b>'+r.refs_count+'</b> refs</span>':'')+(r.claims_count?claimBadge(r.claims_count,r.unsupported_claims_count):'')+'</div>'+(r.md_path?'<div class="mt-1"><a class="action-link" href="file://'+esc(r.md_path)+'" target="_blank">Open document.md →</a></div>':'')+'</div>'}).join('')}
var es=new EventSource('/api/events?token='+encodeURIComponent(token));es.addEventListener('open',function(){document.querySelectorAll('.js-live').forEach(function(e){e.textContent='· live';e.classList.add('live')})});es.addEventListener('error',function(){document.querySelectorAll('.js-live').forEach(function(e){e.textContent='· reconnecting…';e.classList.remove('live')})});es.addEventListener('plugin_state_changed',function(ev){var d={};try{d=JSON.parse(ev.data||'{}')}catch(e){}if(!d.plugin||d.plugin===PLUGIN)load()});
load();
</script>
</body>
</html>
