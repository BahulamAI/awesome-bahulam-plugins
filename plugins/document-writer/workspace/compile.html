<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Document Writer — Compilations</title>
<meta name="bahulam-plugin" content="document-writer">
<link rel="stylesheet" href="/vendor/bahulam-plugin/bahulam-plugin.css">
</head>
<body>
<div class="plugin-page">
<header class="plugin-bar"><span class="brand-mark">B</span><h1>Compilations</h1></header>
<div class="plugin-body">
<div id="empty" class="empty" style="display:none">No compilations yet. Ask the director to compile a target (md / tex / pdf / docx / uspto_xml).</div>
<table class="plugin-table" id="table">
<thead><tr><th>Doc</th><th>Target</th><th>Status</th><th>When</th><th>Path</th><th>Notes</th></tr></thead>
<tbody id="rows"></tbody>
</table>
</div>
</div>
<script>
var token=new URLSearchParams(location.search).get('token')||'',PLUGIN='document-writer';
function esc(s){return String(s??'').replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
async function fetchCompilations(){try{var r=await fetch('/api/plugin-state/'+PLUGIN,{method:'POST',headers:{'Content-Type':'application/json','X-Bahulam-Local-Token':token},body:JSON.stringify({op:'list',stream:'compilations',limit:100})});if(!r.ok)return[];return(await r.json())?.result??[]}catch(e){return[]}}
async function load(){var list=await fetchCompilations(),rows=document.getElementById('rows'),empty=document.getElementById('empty'),items=Array.isArray(list)?list:[];if(!items.length){rows.innerHTML='';empty.style.display='';return}empty.style.display='none';rows.innerHTML=items.slice().reverse().map(function(r){var when=r.at||r.created_at||'';return'<tr><td><code>'+esc(r.slug||'')+'</code></td><td><span class="badge '+(r.target||'md')+'">'+esc(r.target||'md')+'</span></td><td><span class="badge '+(r.status==='ok'||r.status==='success'||r.status==='completed'?'success':r.status==='error'||r.status==='failed'?'error':'warn')+'">'+esc(r.status||'')+'</span></td><td class="small muted">'+esc(when?new Date(when).toLocaleString():'')+'</td><td>'+(r.output_path?'<a href="file://'+esc(r.output_path)+'" target="_blank">open</a>':'')+'</td><td class="muted">'+esc(r.notes||'')+'</td></tr>'}).join('')}
var es=new EventSource('/api/events?token='+encodeURIComponent(token));es.addEventListener('plugin_state_changed',function(ev){var d={};try{d=JSON.parse(ev.data||'{}')}catch(e){}if(!d.plugin||d.plugin===PLUGIN)load()});
load();
</script>
</body>
</html>
