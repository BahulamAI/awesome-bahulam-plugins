<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Document Writer — References</title>
<meta name="bahulam-plugin" content="document-writer">
<link rel="stylesheet" href="/vendor/bahulam-plugin/bahulam-plugin.css">

</head>
<body>
<div class="plugin-page">
<header class="plugin-bar"><span class="brand-mark">B</span><h1>References</h1><div class="flex items-center gap-1" style="margin-left:auto"><select id="doc-picker"></select></div></header>
<div class="plugin-body">
<div id="empty" class="empty" style="display:none">Pick a document above.</div>
<div id="stats" class="small muted mb-1"></div>
<table class="plugin-table" id="table">
<thead><tr><th>ID</th><th>Type</th><th>Title</th><th>Year</th><th>DOI</th></tr></thead>
<tbody id="rows"></tbody>
</table>
</div>
</div>
<script>
var token=new URLSearchParams(location.search).get('token')||'',PLUGIN='document-writer';
function esc(s){return String(s??'').replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
var docs=[],currentSlug=null;
async function fetchDocs(){try{var r=await fetch('/api/plugin-state/'+PLUGIN,{method:'POST',headers:{'Content-Type':'application/json','X-Bahulam-Local-Token':token},body:JSON.stringify({op:'list',stream:'documents',limit:50})});if(!r.ok)return[];return(await r.json())?.result??[]}catch(e){return[]}}
async function fetchDsl(slug){var row=docs.find(function(r){return(r.slug||r.name)===slug});if(!row?.dsl_path)return null;try{var r=await fetch('/api/files?token='+encodeURIComponent(token)+'&path='+encodeURIComponent(row.dsl_path));if(!r.ok)return null;var b=await r.json();return JSON.parse(b?.preview?.content||'{}')}catch(e){return null}}
function renderRefs(dsl){var rows=document.getElementById('rows'),stats=document.getElementById('stats'),empty=document.getElementById('empty');if(!dsl){rows.innerHTML='';stats.textContent='';empty.style.display='';return}empty.style.display='none';var refs=dsl.references||{},entries=Object.entries(refs);stats.textContent=entries.length+' reference'+(entries.length===1?'':'s')+(dsl.meta?.bib_style?' · bib: '+dsl.meta.bib_style:'');rows.innerHTML=entries.map(function(x){var id=x[0],r=x[1],f=r.fields||{};return'<tr><td><code>'+esc(id)+'</code></td><td><span class="badge primary">'+esc(r.type||'misc')+'</span></td><td>'+esc(f.title||'')+'</td><td class="muted">'+esc(''+(f.year||''))+'</td><td>'+(f.doi?'<a href="https://doi.org/'+encodeURIComponent(f.doi)+'" target="_blank">'+esc(f.doi)+'</a>':'')+'</td></tr>'}).join('')}
async function refresh(){docs=await fetchDocs();var picker=document.getElementById('doc-picker'),prev=picker.value||currentSlug;picker.innerHTML='<option value="">— pick document —</option>'+docs.map(function(r){return'<option value="'+esc(r.slug||r.name)+'">'+esc(r.slug||r.name)+'</option>'}).join('');if(prev&&docs.some(function(r){return(r.slug||r.name)===prev})){picker.value=prev;currentSlug=prev;renderRefs(await fetchDsl(prev))}else renderRefs(null)}
document.getElementById('doc-picker').addEventListener('change',async function(e){currentSlug=e.target.value;renderRefs(await fetchDsl(currentSlug))});
var es=new EventSource('/api/events?token='+encodeURIComponent(token));es.addEventListener('plugin_state_changed',function(ev){var d={};try{d=JSON.parse(ev.data||'{}')}catch(e){}if(!d.plugin||d.plugin===PLUGIN)refresh()});
refresh();
</script>
</body>
</html>
