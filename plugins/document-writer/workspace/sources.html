<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Document Writer — Sources</title>
<meta name="bahulam-plugin" content="document-writer">
<link rel="stylesheet" href="/vendor/bahulam-plugin/bahulam-plugin.css">

</head>
<body>
<div class="plugin-page">
<header class="plugin-bar"><span class="brand-mark">B</span><h1>Sources</h1><div class="flex items-center gap-1" style="margin-left:auto"><select id="doc-picker"></select></div></header>
<div class="plugin-body">
<div id="empty" class="empty" style="display:none">Pick a document above.</div>
<div id="stats" class="small muted mb-1"></div>
<div id="cards"></div>
</div>
</div>
<script>
var token=new URLSearchParams(location.search).get('token')||'',PLUGIN='document-writer';
function esc(s){return String(s??'').replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
var docs=[],currentSlug=null;
async function fetchDocs(){try{var r=await fetch('/api/plugin-state/'+PLUGIN,{method:'POST',headers:{'Content-Type':'application/json','X-Bahulam-Local-Token':token},body:JSON.stringify({op:'list',stream:'documents',limit:50})});if(!r.ok)return[];return(await r.json())?.result??[]}catch(e){return[]}}
async function fetchDsl(slug){var row=docs.find(function(r){return(r.slug||r.name)===slug});if(!row?.dsl_path)return null;try{var r=await fetch('/api/files?token='+encodeURIComponent(token)+'&path='+encodeURIComponent(row.dsl_path));if(!r.ok)return null;var b=await r.json();return JSON.parse(b?.preview?.content||'{}')}catch(e){return null}}
function renderSources(dsl){var cards=document.getElementById('cards'),stats=document.getElementById('stats'),empty=document.getElementById('empty');if(!dsl){cards.innerHTML='';stats.textContent='';empty.style.display='';return}empty.style.display='none';var sources=dsl.sources||{},entries=Object.entries(sources),byKind={pdf:0,url:0,note:0,experiment:0};for(var i=0;i<entries.length;i++){var s=entries[i][1];if(byKind[s.kind]!=null)byKind[s.kind]++}stats.textContent=entries.length+' source'+(entries.length===1?'':'s')+' · pdf='+byKind.pdf+' url='+byKind.url+' experiment='+byKind.experiment;cards.innerHTML=entries.map(function(x){var id=x[0],s=x[1];return'<div class="card"><h3><span class="badge primary">'+esc(s.kind||'')+'</span> '+esc(id)+'</h3><div class="meta">'+(s.path?'<div>path: <code>'+esc(s.path)+'</code></div>':'')+(s.url?'<div>url: <a href="'+esc(s.url)+'" target="_blank">'+esc(s.url)+'</a></div>':'')+(s.provider?'<div>provider: '+esc(s.provider)+'</div>':'')+(s.extracted_chars!=null?'<div>chars: '+s.extracted_chars+'</div>':'')+(s.ref_id?'<div>linked to: <code>'+esc(s.ref_id)+'</code></div>':'')+(s.description?'<div>'+esc(s.description)+'</div>':'')+'</div></div>'}).join('')}
async function refresh(){docs=await fetchDocs();var picker=document.getElementById('doc-picker'),prev=picker.value||currentSlug;picker.innerHTML='<option value="">— pick document —</option>'+docs.map(function(r){return'<option value="'+esc(r.slug||r.name)+'">'+esc(r.slug||r.name)+'</option>'}).join('');if(prev&&docs.some(function(r){return(r.slug||r.name)===prev})){picker.value=prev;currentSlug=prev;renderSources(await fetchDsl(prev))}else renderSources(null)}
document.getElementById('doc-picker').addEventListener('change',async function(e){currentSlug=e.target.value;renderSources(await fetchDsl(currentSlug))});
var es=new EventSource('/api/events?token='+encodeURIComponent(token));es.addEventListener('plugin_state_changed',function(ev){var d={};try{d=JSON.parse(ev.data||'{}')}catch(e){}if(!d.plugin||d.plugin===PLUGIN)refresh()});
refresh();
</script>
</body>
</html>
