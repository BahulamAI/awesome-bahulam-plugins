apiVersion: bahulam.plugin/1
kind: Plugin
metadata:
  name: azure-cost-analyzer
  version: 0.2.0
  description: >
    Azure Cost Management analysis plugin. Reads cost data from Azure
    subscriptions, surfaces budget alerts, and generates cost reports.
    Credentials are stored in local plugin state — the LLM never sees them.
  author: BahulamAI
  repository: https://github.com/BahulamAI/awesome-bahulam-plugins

config:
  # Workplane: the agent and the panel commit to ONE document through the host
  # authority. Agents cannot inject HTML or executable chart code — they name a
  # renderer from the host catalog and supply data.
  workplane:
    enabled: true

    # What `workplane-src/main.tsx` registers, and therefore all the agent is
    # offered. workplane.diagram is deliberately absent: Mermaid would have to be
    # inlined into a single-file panel, which costs several megabytes for a cost
    # dashboard that has no diagrams in it.
    renderers:
      - workplane.markdown
      - workplane.code
      - workplane.text
      - workplane.fact
      - workplane.metric
      - workplane.table
      - workplane.form
      - workplane.button
      - workplane.echarts

    # MUST match the id the view opens (workplane-src/document.ts), or the agent
    # and the panel would each edit their own document.
    document:
      id: wp_azure_cost
      title: Azure cost investigation

    # What an agent or a user may commit. Anything not listed here is refused by
    # the authority, so the agent can change the analysis window but cannot
    # reach any other value.
    writablePaths:
      - path: /filters/days
        schema: { type: integer, minimum: 1, maximum: 365 }
      - path: /filters/dimension
        schema:
          type: string
          enum: [region, resource_group, tag, resource_type]
      - path: /selection/services
        schema:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 128 }

  # Declared config fields: the workspace panel renders a settings form
  # from this definition. Values are stored in the plugin's local SQLite
  # KV table under the `_config` key. Tool handlers read them via
  # `state.getConfig(fieldName)`.
  config:
    fields:
      - name: subscription_id
        type: string
        label: "Azure Subscription ID"
        required: true
        credential: false
        description: "The UUID of the Azure subscription to analyze"
        placeholder: "00000000-0000-0000-0000-000000000000"
      - name: tenant_id
        type: string
        label: "Azure Tenant ID"
        required: true
        credential: false
        description: "Azure AD tenant ID for authentication"
        placeholder: "00000000-0000-0000-0000-000000000000"
      - name: client_id
        type: string
        label: "Service Principal Client ID"
        required: true
        credential: false
        description: "App registration client ID with Cost Management Reader role"
        placeholder: "00000000-0000-0000-0000-000000000000"
      - name: client_secret
        type: password
        label: "Service Principal Secret"
        required: true
        credential: true
        description: "Client secret for the service principal (stored locally, never sent to LLM)"
        placeholder: ""
      - name: currency
        type: select
        label: "Currency"
        required: false
        default: "USD"
        options: ["USD", "EUR", "GBP", "INR", "JPY", "AUD"]
        description: "Currency for cost display"

  tools:
    - name: azure_list_subscriptions
      description: >
        List accessible Azure subscriptions with current month-to-date cost.
        Reads credentials from plugin config (never exposed to LLM).
      tool: ./tools/list-subscriptions.mjs
      parameters:
        type: object
        properties: {}

    - name: azure_cost_by_service
      description: >
        Get cost breakdown by Azure service for the current billing period.
        Reads credentials from plugin config.
      tool: ./tools/cost-by-service.mjs
      parameters:
        type: object
        properties:
          days:
            type: integer
            description: Number of days to look back (default 30)

    - name: azure_budget_alerts
      description: >
        Check configured Azure budgets and alert on any that exceed threshold.
        Reads credentials from plugin config.
      tool: ./tools/budget-alerts.mjs
      parameters:
        type: object
        properties:
          threshold_percent:
            type: integer
            description: Alert when budget consumed exceeds this percentage (default 80)

    - name: azure_resources_by_type
      description: >
        Get Azure cost breakdown by resource type with individual resource
        details including region, resource group, and tags. Drill-down view.
      tool: ./tools/resources-by-type.mjs
      parameters:
        type: object
        properties:
          days:
            type: integer
            description: Number of days to look back (default 30)
          filter_type:
            type: string
            description: Optional filter to a specific resource type

    - name: azure_cost_by_dimension
      description: >
        Get Azure costs aggregated by a chosen dimension: region,
        resource_group, tag, or resource_type. Slice-and-dice analysis.
      tool: ./tools/cost-by-dimension.mjs
      parameters:
        type: object
        properties:
          dimension:
            type: string
            enum: [region, resource_group, tag, resource_type]
            description: Dimension to aggregate by (default region)
          days:
            type: integer
            description: Number of days to look back (default 30)

    - name: azure_cost_trend
      description: >
        Get daily Azure cost data points for trend line chart visualization.
      tool: ./tools/cost-trend.mjs
      parameters:
        type: object
        properties:
          days:
            type: integer
            description: Number of days to look back (default 30)

  views:
    # The sole view. The previous hand-written HTML panel was removed in favour
    # of this one, which is a Workplane document: scenes and addressable blocks
    # that a user and an agent edit through one validated command gateway.
    #
    # The document lives in the workplane tables, reached through the same
    # command gateway the agent commits to. There is no second write path.
    - name: "Azure Cost"
      type: panel
      source: ./workspace/workplane.html
