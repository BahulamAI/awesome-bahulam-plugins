<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plugin state</title>
<!--
  A deterministic reader of this plugin's own SQLite state.

  It INTERPRETS NOTHING. Tables are discovered from the database rather than
  hardcoded, rows are shown in the order stored, and the only transformation is
  turning integer minor units back into an amount using the exponent that was
  stored beside it. There are no charts, no derived totals, and no layout an
  agent can author — those belong to a different layer (PRD-108 section 28.5),
  and mixing them in here is how a viewer starts quietly disagreeing with the
  database it is supposed to show.

  Self-contained on purpose. The host serves this file from the plugin directory
  and a relative <script src> would inherit no token, so it would 401. No
  external asset, no framework, no build step.

  Generic on purpose too: nothing below names this plugin or its tables, so the
  file is the same for any plugin whose tools write declared state.
-->
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --surface: #f7f8fa; --border: #d8dce3;
    --text: #16191d; --muted: #5b6270; --accent: #1f5fd6; --error: #8c1c24;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c; --surface: #1c2027; --border: #333a45;
      --text: #eef1f5; --muted: #9aa3b2; --accent: #7aa7ff; --error: #f3b0b5;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
  }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  h1 { font-size: 1rem; margin: 0; }
  .meta { color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }
  button {
    font: inherit; padding: 4px 12px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer;
  }
  button:hover { background: var(--surface); }
  section { margin-bottom: 24px; }
  h2 { font-size: .85rem; margin: 0 0 6px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .rowcount { color: var(--muted); font-weight: 400; }
  .scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: .85rem; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { background: var(--surface); font-weight: 600; position: sticky; top: 0; }
  tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .empty, .note { color: var(--muted); font-size: .85rem; }
  .error {
    color: var(--error); background: color-mix(in srgb, var(--error) 8%, transparent);
    border: 1px solid currentColor; border-radius: 8px; padding: 10px 12px;
  }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
</style>

<header>
  <h1>Plugin state</h1>
  <span class="meta" id="meta"></span>
  <button type="button" id="refresh">Refresh</button>
</header>
<div id="root"><p class="empty">Reading state…</p></div>

<script type="module">
  // The host opens this file in a sandboxed iframe with ?token=<session token>,
  // and the plugin name is in the path it was served from. Both are read rather
  // than configured, so the file needs no per-plugin edit.
  const params = new URLSearchParams(location.search);
  const token = params.get('token') ?? '';
  const plugin = decodeURIComponent(location.pathname.split('/')[2] ?? '');

  /** Tables the host owns. Not this plugin's declared state, so not shown. */
  const HOST_TABLES = new Set(['kv', 'records', 'applied_migrations']);

  async function state(op, body = {}) {
    const response = await fetch(`/api/plugin-state/${encodeURIComponent(plugin)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Bahulam-Local-Token': token },
      body: JSON.stringify({ op, ...body }),
    });
    const data = await response.json();
    if (!response.ok || data.ok === false) {
      throw new Error(data.message || data.error || `state ${op} failed (${response.status})`);
    }
    return data.result;
  }

  const query = (sql, args = []) => state('query', { sql, params: args });

  /**
   * Turn integer minor units back into an amount using the exponent STORED WITH
   * the row. Guessing two decimals would be wrong for JPY and for KWD, and a
   * viewer that guesses is a viewer that misreports.
   */
  function formatAmount(minor, currency, exponent) {
    const digits = Number.isInteger(exponent) ? exponent : 2;
    const value = Number(minor) / 10 ** digits;
    const text = value.toLocaleString(undefined, {
      minimumFractionDigits: digits, maximumFractionDigits: digits,
    });
    return currency ? `${text} ${currency}` : text;
  }

  const escape = (value) => String(value ?? '').replace(/[&<>"]/g,
    (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]);

  /** A cell's text. The only rule beyond "show what is stored". */
  function cell(row, column, columns) {
    const value = row[column];
    if (value === null || value === undefined) return '—';
    // `*_minor` is money, and its currency and exponent travel in the same row
    // or in the run this row belongs to.
    if (column.endsWith('_minor')) {
      return formatAmount(value, row.currency ?? row._currency, row.currency_exponent ?? row._currency_exponent);
    }
    if (typeof value === 'object') return JSON.stringify(value);
    return String(value);
  }

  function isNumeric(column, rows) {
    return rows.some((row) => typeof row[column] === 'number' || column.endsWith('_minor'));
  }

  function renderTable(rows) {
    if (!rows.length) return '<p class="empty">No rows.</p>';
    const columns = Object.keys(rows[0]).filter((name) => !name.startsWith('_'));
    const head = columns.map((name) =>
      `<th class="${isNumeric(name, rows) ? 'num' : ''}">${escape(name)}</th>`).join('');
    const body = rows.map((row) => '<tr>' + columns.map((name) =>
      `<td class="${isNumeric(name, rows) ? 'num' : ''}">${escape(cell(row, name, columns))}</td>`,
    ).join('') + '</tr>').join('');
    return `<div class="scroll"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
  }

  /** Every table this plugin declared, discovered rather than hardcoded. */
  async function declaredTables() {
    const rows = await query(
      "SELECT name FROM sqlite_master WHERE type = 'table' AND name NOT LIKE 'sqlite_%' ORDER BY name",
    );
    return rows.map((row) => row.name).filter((name) => !HOST_TABLES.has(name));
  }

  /**
   * Rows for one table, newest first where the table records a time, and
   * bounded — a viewer that tries to render an unbounded table is a viewer that
   * stops rendering at all.
   */
  async function tableRows(name, limit = 200) {
    const columns = (await query(`PRAGMA table_info("${name}")`)).map((column) => column.name);
    const order = ['captured_at', 'created_at', 'updated_at', 'id'].find((c) => columns.includes(c));
    const sql = `SELECT * FROM "${name}"${order ? ` ORDER BY "${order}" DESC` : ''} LIMIT ${limit}`;
    return { columns, rows: await query(sql), truncated: (await query(`SELECT COUNT(*) AS n FROM "${name}"`))[0].n > limit };
  }

  /**
   * Rows that belong to a run inherit its currency and exponent, so an amount
   * can be rendered correctly without repeating them on every row. Carried as
   * underscore-prefixed fields, which `renderTable` hides.
   */
  function inheritCurrency(rows, runsById) {
    if (!runsById) return rows;
    return rows.map((row) => {
      const run = row.run_id !== undefined ? runsById.get(row.run_id) : undefined;
      return run ? { ...row, _currency: run.currency, _currency_exponent: run.currency_exponent } : row;
    });
  }

  async function render() {
    const root = document.getElementById('root');
    try {
      const names = await declaredTables();
      if (!names.length) {
        root.innerHTML = '<p class="empty">This plugin has no declared state tables yet. '
          + 'Run one of its tools, or declare tables under <code>config.state.tables</code>.</p>';
        document.getElementById('meta').textContent = plugin;
        return;
      }

      // Read runs first so rows can inherit their currency.
      let runsById = null;
      if (names.includes('cost_runs')) {
        const runs = await query('SELECT id, currency, currency_exponent FROM cost_runs');
        runsById = new Map(runs.map((run) => [run.id, run]));
      }

      const sections = [];
      let total = 0;
      for (const name of names) {
        const { rows, truncated } = await tableRows(name);
        total += rows.length;
        sections.push(
          `<section><h2>${escape(name)} <span class="rowcount">${rows.length} row${rows.length === 1 ? '' : 's'}`
          + `${truncated ? ' (most recent shown)' : ''}</span></h2>`
          + renderTable(inheritCurrency(rows, runsById)) + '</section>',
        );
      }

      // kv holds small structured values. `keys` already excludes the protected
      // config key, so nothing here can leak a credential.
      const keys = await state('keys');
      if (keys.length) {
        const entries = [];
        for (const key of keys) entries.push({ key, value: await state('get', { key }) });
        sections.push('<section><h2>kv <span class="rowcount">'
          + `${entries.length} key${entries.length === 1 ? '' : 's'}</span></h2>`
          + renderTable(entries.map(({ key, value }) => ({
            key, value: typeof value === 'object' ? JSON.stringify(value) : value,
          }))) + '</section>');
      }

      root.innerHTML = sections.join('');
      document.getElementById('meta').textContent =
        `${plugin} · ${names.length} table${names.length === 1 ? '' : 's'} · ${total} rows · read ${new Date().toISOString()}`;
    } catch (error) {
      // Say what failed. A blank panel is indistinguishable from empty state.
      root.innerHTML = `<p class="error">Could not read plugin state: ${escape(error.message)}</p>`;
    }
  }

  document.getElementById('refresh').addEventListener('click', render);

  // The host emits plugin_state_changed after any committed write, so the panel
  // re-reads instead of polling. If the stream is unavailable the Refresh button
  // is still the whole contract.
  try {
    const events = new EventSource(`/api/events?token=${encodeURIComponent(token)}`);
    events.addEventListener('plugin_state_changed', render);
  } catch { /* no live updates; Refresh still works */ }

  render();
</script>
