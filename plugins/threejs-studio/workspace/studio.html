<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Three.js Studio</title>
<meta name="bahulam-plugin" content="threejs-studio">
<link rel="stylesheet" href="/vendor/bahulam-plugin/bahulam-plugin.css">

</head>
<body>
<div class="plugin-page">
<header class="plugin-bar"><span class="brand-mark">B</span><h1>Three.js Studio</h1><span class="live-badge js-live">· connecting…</span></header>
<div class="plugin-body">
<div id="empty" class="empty" style="display:none">No Three.js scenes yet.<br><small>Ask the director to create one. Scenes appear here once saved.</small></div>
<table class="plugin-table"><thead><tr><th>Status</th><th>Slug</th><th>Title</th><th>Path</th><th>Created</th><th>Notes</th></tr></thead><tbody id="scenes"></tbody></table>
</div>
</div>
<script>
var TOKEN=new URLSearchParams(location.search).get('token')||'',PLUGIN='threejs-studio';
function esc(s){return String(s??'').replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
async function fetchScenes(){try{var r=await fetch('/api/plugin-state/'+PLUGIN,{method:'POST',headers:{'Content-Type':'application/json','X-Bahulam-Local-Token':TOKEN},body:JSON.stringify({op:'list',stream:'scenes',limit:50})});if(!r.ok)return[];var b=await r.json();return b?.result??[]}catch(e){return[]}}
function sb(s){var c=(s||'draft').toLowerCase().replace(/[^a-z]/g,'');var m={completed:'success',failed:'error',draft:'warn'};return'<span class="badge '+(m[c]||'primary')+'">'+esc(s||'draft')+'</span>'}
async function load(){var rows=await fetchScenes();var tbody=document.getElementById('scenes'),empty=document.getElementById('empty');if(!rows||!rows.length){tbody.innerHTML='';empty.style.display='';return}empty.style.display='none';tbody.innerHTML=rows.map(function(r){var slug=r.slug||r.name||'-',title=r.title||slug,path=r.path||r.html_path||'',created=r.created_at?new Date(r.created_at).toLocaleString():'-';return'<tr><td>'+sb(r.status)+'</td><td><code>'+esc(slug)+'</code></td><td>'+esc(title)+'</td><td>'+(path?'<a href="file://'+esc(path)+'" target="_blank">open</a>':'-')+'</td><td class="muted small">'+esc(created)+'</td><td class="muted">'+esc(r.notes||'')+'</td></tr>'}).join('')}
var es=new EventSource('/api/events?token='+encodeURIComponent(TOKEN));es.addEventListener('open',function(){document.querySelectorAll('.js-live').forEach(function(e){e.textContent='· live';e.classList.add('live')})});es.addEventListener('error',function(){document.querySelectorAll('.js-live').forEach(function(e){e.textContent='· reconnecting…';e.classList.remove('live')})});es.addEventListener('plugin_state_changed',function(ev){var d={};try{d=JSON.parse(ev.data||'{}')}catch(e){}if(!d.plugin||d.plugin===PLUGIN)load()});
load();
</script>
</body>
</html>
