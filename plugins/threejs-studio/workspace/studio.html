<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Three.js Studio</title>
<style>
:root {
  --bg: #0f172a;
  --fg: #e2e8f0;
  --muted: #64748b;
  --ok: #22c55e;
  --err: #ef4444;
  --brand: #6366f1;
  --border: #1e293b;
}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;font-size:14px}
body{display:flex;flex-direction:column}
header{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
h1{margin:0;font-size:18px;font-weight:600}
#connection{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
#connection.dead{background:var(--err)}
#content{flex:1;padding:16px 24px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 12px;border-bottom:2px solid var(--border);color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:top}
.status{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500}
.status.completed{background:rgba(34,197,94,.15);color:var(--ok)}
.status.failed{background:rgba(239,68,68,.15);color:var(--err)}
.status.draft{background:rgba(100,116,139,.15);color:var(--muted)}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
.empty{padding:40px;text-align:center;color:var(--muted)}
.empty p{margin:4px 0}
#refresh{padding:8px 16px;background:var(--brand);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px;margin-left:auto}
#refresh:hover{filter:brightness(1.15)}
</style>
</head>
<body>
<header>
  <span id="connection" title="Connected"></span>
  <h1>Three.js Studio</h1>
  <button id="refresh">Refresh</button>
</header>
<div id="content">
  <table>
    <thead><tr><th>Status</th><th>Slug</th><th>Title</th><th>Path</th><th>Created</th><th>Notes</th></tr></thead>
    <tbody id="scenes"></tbody>
  </table>
  <div id="empty" class="empty" style="display:none">
    <p>No Three.js scenes yet.</p>
    <p>Ask the director to create one.</p>
  </div>
</div>
<script>
// The workspace mounts this panel's iframe with ?token= in the URL
const TOKEN = new URLSearchParams(location.search).get('token') || '';
const PLUGIN = 'threejs-studio';
const headers = {
  'Content-Type': 'application/json',
  ...(TOKEN ? { 'X-Bahulam-Local-Token': TOKEN } : {}),
};

async function fetchScenes() {
  try {
    const res = await fetch(`/api/plugin-state/${PLUGIN}`, {
      method: 'POST',
      headers,
      body: JSON.stringify({ op: 'list', stream: 'scenes', limit: 50 }),
    });
    if (!res.ok) return [];
    const body = await res.json();
    return body?.result ?? [];
  } catch {
    return [];
  }
}

function statusBadge(status) {
  const cls = (status || 'draft').toLowerCase().replace(/[^a-z]/g, '');
  return `<span class="status ${cls}">${status || 'draft'}</span>`;
}

function render(rows) {
  const tbody = document.getElementById('scenes');
  const empty = document.getElementById('empty');
  const list = Array.isArray(rows) ? rows : (rows?.renders || rows?.scenes || []);
  if (!list.length) {
    tbody.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';
  tbody.innerHTML = list.map(r => {
    const slug = r.slug || r.name || '-';
    const title = r.title || slug;
    const path = r.path || r.html_path || '';
    const created = r.created_at ? new Date(r.created_at).toLocaleString() : '-';
    const notes = r.notes || '';
    return `<tr>
      <td>${statusBadge(r.status)}</td>
      <td><code>${slug}</code></td>
      <td>${title}</td>
      <td>${path ? `<a href="file://${path}" target="_blank">open</a>` : '-'}</td>
      <td>${created}</td>
      <td>${notes}</td>
    </tr>`;
  }).join('');
}

// Initial load — query the state API directly
fetchScenes().then(render);

// Listen for postMessage from parent workspace (pushes on plugin_state_changed)
window.addEventListener('message', (e) => {
  if (e.data?.type === 'plugin_state_changed') {
    fetchScenes().then(render);
  }
});

// Refresh button re-queries the state API
document.getElementById('refresh').addEventListener('click', () => {
  fetchScenes().then(render);
});

// Mark connection alive
document.getElementById('connection').className = '';
</script>
</body>
</html>
