<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Three.js Studio · Viewport</title>
<meta name="bahulam-plugin" content="threejs-studio">
<link rel="stylesheet" href="/vendor/bahulam-plugin/bahulam-plugin.css">

</head>
<body>
<div style="display:flex;flex-direction:column;height:100%">
<header class="plugin-bar"><span class="brand-mark">B</span><h1>Viewport</h1><select id="scene-picker" style="margin-left:8px"></select><button class="btn" id="refresh" style="margin-left:4px">Refresh</button><button class="btn" id="open-tab" style="margin-left:4px">Open ↗</button><span class="live-badge js-live">· connecting…</span></header>
<div id="main">
<aside id="sidebar">
<h2>Scene Tree</h2>
<div id="tree" class="dim">(select a scene)</div>
<h2>Materials</h2>
<div id="materials" class="dim">—</div>
<h2>Assets</h2>
<div id="assets" class="dim">—</div>
</aside>
<div id="viewport-area">
<iframe id="viewport" src="about:blank" title="scene viewport"></iframe>
<div id="empty"><div>No scene selected.</div><div class="dim">Create one via the director, then pick it above.</div></div>
</div>
</div>
</div>
<script>
var TOKEN=new URLSearchParams(location.search).get('token')||'',PLUGIN='threejs-studio';
function esc(s){return String(s??'').replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
var scenes=[],currentSlug=null;
async function fetchScenes(){try{var r=await fetch('/api/plugin-state/'+PLUGIN,{method:'POST',headers:{'Content-Type':'application/json','X-Bahulam-Local-Token':TOKEN},body:JSON.stringify({op:'list',stream:'scenes',limit:50})});if(!r.ok)return[];var b=await r.json(),list=b?.result??[],seen=new Set;return list.filter(function(x){var s=x.slug||x.name;if(!s||seen.has(s))return false;seen.add(s);return true})}catch(e){return[]}}
function loadScene(slug){currentSlug=slug;var row=scenes.find(function(r){return(r.slug||r.name)===slug});var vp=document.getElementById('viewport'),empty=document.getElementById('empty'),tree=document.getElementById('tree'),mats=document.getElementById('materials'),assets=document.getElementById('assets');if(!row){vp.src='about:blank';empty.style.display='';return}var html=row.html_path||row.path;if(!html){vp.src='about:blank';empty.style.display='';return}vp.src='file://'+encodeURI(html)+'?t='+Date.now();empty.style.display='none';tree.innerHTML='<div class="hint">Loaded: '+esc(row.title||row.slug)+'</div><div class="dim" style="margin-top:6px">Path: <span class="mono">'+esc(html)+'</span></div>';mats.innerHTML='<div class="dim">(open dev tools to inspect)</div>';assets.innerHTML='<div class="dim">(see scene.json alongside index.html)</div>'}
async function refresh(){scenes=await fetchScenes();var picker=document.getElementById('scene-picker'),prev=picker.value||currentSlug;picker.innerHTML='<option value="">— pick scene —</option>'+scenes.map(function(r){return'<option value="'+esc(r.slug||r.name)+'">'+esc(r.slug||r.name)+(r.title?' — '+esc(r.title):'')+'</option>'}).join('');if(prev&&scenes.some(function(r){return(r.slug||r.name)===prev})){picker.value=prev;loadScene(prev)}}
document.getElementById('scene-picker').addEventListener('change',function(e){loadScene(e.target.value)});document.getElementById('refresh').addEventListener('click',refresh);document.getElementById('open-tab').addEventListener('click',function(){var row=scenes.find(function(r){return(r.slug||r.name)===currentSlug});if(row)window.open('file://'+(row.html_path||row.path),'_blank')});
var es=new EventSource('/api/events?token='+encodeURIComponent(TOKEN));es.addEventListener('open',function(){document.querySelectorAll('.js-live').forEach(function(e){e.textContent='· live';e.classList.add('live')})});es.addEventListener('error',function(){document.querySelectorAll('.js-live').forEach(function(e){e.textContent='· reconnecting…';e.classList.remove('live')})});es.addEventListener('plugin_state_changed',function(ev){var d={};try{d=JSON.parse(ev.data||'{}')}catch(e){}if(!d.plugin||d.plugin===PLUGIN)refresh()});
refresh();
</script>
</body>
</html>
