# Canonical contract for the render_scene tool.
#
# Both the OSS plugin (plugins/manim-studio/tools/render-scene.mjs) and
# the SaaS Video Studio (codekepler-backend
# app/workspaces/video_studio/render_manim.py) implement this contract.
# The OSS impl runs manim as a local subprocess; the SaaS impl POSTs to
# a Django render service that runs manim in Celery inside Azure
# Container Apps. Same params in, same shape out — different substrate.

name: render_scene
description: >
  Save a Manim CE scene to the render workspace, run manim, and return
  the rendered mp4 path/URL. Blocks until the render finishes. Failed
  renders return {success: false} with an error_kind — no partial state
  left behind, no credit charged (SaaS).

parameters:
  type: object
  properties:
    slug:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
      description: >
        URL-safe folder name for this render. Used as the manifest
        subfolder and the manim media_dir subfolder.
    scene_class:
      type: string
      pattern: "^[A-Z][A-Za-z0-9_]{0,63}$"
      description: >
        The Python class name of the Scene defined in scene_source.
        Must match exactly — the tool validates this before invoking manim.
    scene_source:
      type: string
      description: >
        Complete Manim CE Python source. Must define exactly the
        scene_class given. May import from ../assets/*.
    quality:
      type: string
      enum: [l, m, h, "720p", "1080p", "1440p"]
      description: >
        Render tier. l/m/h are the OSS aliases; 720p/1080p/1440p are the
        SaaS aliases. Both accepted by both impls.
    title:
      type: string
      description: >
        Optional human-readable title. Defaults to the slug. Persisted
        in manifest.json + script.md heading.
    approved_script:
      type: string
      description: >
        Optional approved storyboard/brief markdown. Persisted next to
        scene.py as script.md so the reviewer can compare intent vs
        actual output.
  required: [slug, scene_class, scene_source, quality]
  additionalProperties: false

returns:
  type: object
  properties:
    success:
      type: boolean
    output_url:
      type: [string, "null"]
      description: >
        SaaS: signed Azure Blob URL (24h TTL). OSS: absolute local path
        to the mp4. Present on success.
    output_path:
      type: [string, "null"]
      description: Filesystem path to the mp4 (relative or absolute).
    thumbnail_url:
      type: [string, "null"]
    thumbnail_path:
      type: [string, "null"]
    manifest_path:
      type: [string, "null"]
      description: Path to the written manifest.json.
    scene_path:
      type: [string, "null"]
      description: Path to the saved scene.py.
    render_id:
      type: [string, "null"]
    duration_ms:
      type: [integer, "null"]
    quality:
      type: string
    credits_charged:
      type: [integer, "null"]
      description: SaaS only; null on OSS.
    error:
      type: [string, "null"]
      description: Human-readable error string when success is false.
    error_kind:
      type: [string, "null"]
      enum: ["scene_validation", "render_execution", "upload", "internal", null]
      description: >
        Retryable-vs-terminal classification. scene_validation and
        render_execution are retryable by the animator (once).
        upload and internal are infrastructure bugs — surface, don't retry.
    stderr_tail:
      type: [string, "null"]
      description: Last ~500 chars of manim stderr on render_execution errors.
  required: [success]
