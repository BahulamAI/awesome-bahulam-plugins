apiVersion: bahulam.plugin/1
kind: Plugin
metadata:
  name: manim-studio
  version: 0.1.0
  description: >
    Text-to-video animation studio. The animator agent writes Manim CE
    scenes from plain-language briefs, renders run as background jobs
    (the agent keeps working while ffmpeg grinds), a reviewer agent wakes
    on completion to verify or fix, and the workspace gallery updates
    live as each video lands. Requires python3 + manim + ffmpeg locally
    (see README).
  author: BahulamAI
  repository: https://github.com/BahulamAI/awesome-bahulam-plugins

config:
  tools:
    - name: render_scene
      description: >
        Canonical Bahulam render tool. Writes a Manim CE scene to
        manim-studio/renders/<slug>/{scene.py, manifest.json[, script.md]}
        so the source, storyboard, manifest, and eventually the rendered
        video all live in one folder — inspectable from a plain file
        browser. Shared reusable code lives one level up under
        manim-studio/assets/ (colors.py, fonts.yaml, helpers/, templates/)
        and can be imported from scene.py.

        OSS behavior (this impl): saves the files, records a manifest,
        and returns the manim CLI command for the agent to launch via
        `shell run_in_background`. SaaS impl (bahulam.ai/video) instead
        blocks-and-returns-URL — same tool name + params, different
        substrate. See config/README.md.
      tool: ./tools/render-scene.mjs
      parameters:
        type: object
        properties:
          name:
            type: string
            description: "Slug for this scene (e.g. compound-interest). Used for the render folder and video names."
          scene_class:
            type: string
            description: "The Python class name of the Scene (e.g. CompoundInterest)."
          code:
            type: string
            description: "Complete Manim CE Python source. Must define exactly the scene_class given. May import from manim-studio/assets/."
          quality:
            type: string
            enum: [l, m, h]
            description: "Render quality: l=480p (fast drafts), m=720p (default), h=1080p."
          title:
            type: string
            description: "Optional human-readable title for the render. Defaults to the slug."
          script:
            type: string
            description: "Optional approved storyboard/brief markdown. Persisted next to scene.py as script.md."
        required: [name, scene_class, code]

    - name: register_render
      description: >
        Record a completed (or failed) render on the plugin's shared
        blackboard — the workspace gallery lists renders from here. The
        render-reviewer calls this after inspecting a finished job.
      tool: ./tools/register-render.mjs
      parameters:
        type: object
        properties:
          name:         { type: string, description: "Scene slug" }
          scene_class:  { type: string }
          status:       { type: string, enum: [completed, failed, fixed_and_rerendered] }
          video_path:   { type: string, description: "Path to the rendered .mp4 (empty when failed)" }
          duration_s:   { type: number, description: "Render wall-clock seconds" }
          notes:        { type: string, description: "Reviewer verdict — one or two lines" }
        required: [name, status]

    - name: list_renders
      description: List saved scenes and completed/failed renders from the shared blackboard, newest first.
      tool: ./tools/list-renders.mjs
      parameters:
        type: object
        properties:
          limit: { type: integer, description: "Max rows (default 20)" }
        required: []

  # Entry/primary agent — the workspace's front door. Mirrors SaaS's
  # workspace.yaml convention so codekepler-backend can consume the
  # same file directly via git submodule. The director agent that
  # orchestrates the plan → animator → reviewer chain.
  workspace_agent: ./config/workspace.yaml

  # Sub-agents the director delegates to. Auto-loaded by the CLI
  # manifest loader (see codekepler-npm PR #20).
  agents_from: ./config/agents/

  workspace:
    views:
      - type: panel
        name: Manim Studio
        source: ./workspace/studio.html
