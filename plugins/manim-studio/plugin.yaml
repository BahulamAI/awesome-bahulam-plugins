apiVersion: bahulam.plugin/1
kind: Plugin
metadata:
  name: manim-studio
  version: 0.1.0
  description: >
    Text-to-video animation studio. The animator agent writes Manim CE
    scenes from plain-language briefs, renders run as background jobs
    (the agent keeps working while ffmpeg grinds), a reviewer agent wakes
    on completion to verify or fix, and the workspace gallery updates
    live as each video lands. Requires python3 + manim + ffmpeg locally
    (see README).
  author: BahulamAI
  repository: https://github.com/BahulamAI/awesome-bahulam-plugins

config:
  requirements:
    system:
      - name: python3
        version: ">=3.9"
        reason: Manim Community Edition runs as a Python package.
      - name: manim
        version: ">=0.18"
        reason: Renders scene.py files into MP4 outputs.
      - name: ffmpeg
        reason: Encodes rendered animation frames into MP4 files.
    env: []
    filesystem:
      - path: .bahulam/tmp/manim/manim-studio
        access: read_write
        reason: Stores generated scene.py, script.md, manifest.json, and render outputs.

  state:
    tables:
      - name: render_scenes
        columns:
          - { name: id, type: INTEGER, primary: true, autoincrement: true }
          - { name: slug, type: TEXT, not_null: true }
          - { name: title, type: TEXT, not_null: true }
          - { name: scene_class, type: TEXT, not_null: true }
          - { name: quality, type: TEXT, not_null: true, default: "'m'" }
          - { name: resolution, type: TEXT, not_null: true }
          - { name: scene_path, type: TEXT, not_null: true }
          - { name: script_path, type: TEXT }
          - { name: manifest_path, type: TEXT, not_null: true }
          - { name: expected_video, type: TEXT, not_null: true }
          - { name: status, type: TEXT, not_null: true, default: "'saved'" }
          - { name: created_at, type: TEXT, not_null: true }
          - { name: updated_at, type: TEXT, not_null: true }
        indexes:
          - { columns: [slug] }
          - { columns: [status] }

      - name: render_approvals
        columns:
          - { name: id, type: INTEGER, primary: true, autoincrement: true }
          - { name: scene_id, type: INTEGER, references: "render_scenes(id)" }
          - { name: slug, type: TEXT, not_null: true }
          - { name: reviewer, type: TEXT, not_null: true }
          - { name: decision, type: TEXT, not_null: true }
          - { name: notes, type: TEXT, not_null: true, default: "''" }
          - { name: approved_script_path, type: TEXT, not_null: true, default: "''" }
          - { name: created_at, type: TEXT, not_null: true }
        indexes:
          - { columns: [slug] }
          - { columns: [decision] }

      - name: render_jobs
        columns:
          - { name: id, type: INTEGER, primary: true, autoincrement: true }
          - { name: scene_id, type: INTEGER, references: "render_scenes(id)" }
          - { name: slug, type: TEXT, not_null: true }
          - { name: status, type: TEXT, not_null: true }
          - { name: video_path, type: TEXT, not_null: true, default: "''" }
          - { name: duration_s, type: REAL }
          - { name: notes, type: TEXT, not_null: true, default: "''" }
          - { name: created_at, type: TEXT, not_null: true }
          - { name: completed_at, type: TEXT }
        indexes:
          - { columns: [slug] }
          - { columns: [status] }

    context_always:
      - { stream: render_activity, limit: 5 }

    context_tools:
      - name: list_render_scenes
        table: render_scenes
        description: List saved Manim scenes with source, manifest, expected output, and status.
        parameters:
          type: object
          properties:
            limit: { type: integer, description: "Max rows to return." }

      - name: list_render_jobs
        table: render_jobs
        description: List render job outcomes with video paths, status, duration, and reviewer notes.
        parameters:
          type: object
          properties:
            slug: { type: string, description: "Optional scene slug." }
            limit: { type: integer, description: "Max rows to return." }
        where: "slug = ?"
        params: [slug]

      - name: list_render_approvals
        table: render_approvals
        description: List user/director approval decisions before render execution.
        parameters:
          type: object
          properties:
            slug: { type: string, description: "Optional scene slug." }
            limit: { type: integer, description: "Max rows to return." }
        where: "slug = ?"
        params: [slug]

  tools:
    - name: render_scene
      description: >
        Canonical Bahulam render tool. Writes a Manim CE scene to
        manim-studio/renders/<slug>/{scene.py, manifest.json[, script.md]}
        so the source, storyboard, manifest, and eventually the rendered
        video all live in one folder — inspectable from a plain file
        browser. Shared reusable code lives one level up under
        manim-studio/assets/ (colors.py, fonts.yaml, helpers/, templates/)
        and can be imported from scene.py.

        OSS behavior (this impl): saves the files, records a manifest,
        and returns the manim CLI command for the agent to launch via
        `shell run_in_background`. SaaS impl (bahulam.ai/video) instead
        blocks-and-returns-URL — same tool name + params, different
        substrate. See config/README.md.
      tool: ./tools/render-scene.mjs
      parameters:
        type: object
        properties:
          name:
            type: string
            description: "Slug for this scene (e.g. compound-interest). Used for the render folder and video names."
          scene_class:
            type: string
            description: "The Python class name of the Scene (e.g. CompoundInterest)."
          code:
            type: string
            description: "Complete Manim CE Python source. Must define exactly the scene_class given. May import from manim-studio/assets/."
          quality:
            type: string
            enum: [l, m, h]
            description: "Render quality: l=480p (fast drafts), m=720p (default), h=1080p."
          title:
            type: string
            description: "Optional human-readable title for the render. Defaults to the slug."
          script:
            type: string
            description: "Optional approved storyboard/brief markdown. Persisted next to scene.py as script.md."
        required: [name, scene_class, code]

    - name: register_render
      description: >
        Record a completed (or failed) render on the plugin's shared
        state — the workspace gallery lists renders from here. The
        render-reviewer calls this after inspecting a finished job.
      tool: ./tools/register-render.mjs
      parameters:
        type: object
        properties:
          name:         { type: string, description: "Scene slug" }
          scene_class:  { type: string }
          status:       { type: string, enum: [completed, failed, fixed_and_rerendered] }
          video_path:   { type: string, description: "Path to the rendered .mp4 (empty when failed)" }
          duration_s:   { type: number, description: "Render wall-clock seconds" }
          notes:        { type: string, description: "Reviewer verdict — one or two lines" }
        required: [name, status]

    - name: list_renders
      description: List saved scenes and completed/failed renders from durable state, newest first.
      tool: ./tools/list-renders.mjs
      parameters:
        type: object
        properties:
          limit: { type: integer, description: "Max rows (default 20)" }
        required: []

    - name: render_approval_record
      description: >
        Persist the user/director approval gate before render execution.
        Call this after the user explicitly approves, rejects, or requests
        changes to the storyboard/script. This is the durable handoff record
        between the director and animator.
      tool: ./tools/render-approval-record.mjs
      parameters:
        type: object
        properties:
          slug: { type: string, description: "Scene slug being approved." }
          reviewer: { type: string, description: "Approver identity, usually user or director." }
          decision: { type: string, enum: [approved, rejected, changes_requested] }
          notes: { type: string, description: "Approval notes or requested changes." }
          approved_script_path: { type: string, description: "Optional path to the approved script.md." }
        required: [slug, reviewer, decision]

    - name: render_report
      description: >
        Build an evidence report for a scene or the current workspace: saved
        source, approvals, render jobs, video paths, readiness, and failures.
      tool: ./tools/render-report.mjs
      parameters:
        type: object
        properties:
          slug: { type: string, description: "Optional scene slug." }
        required: []

  # Entry/primary agent — the workspace's front door. Mirrors SaaS's
  # workspace.yaml convention so codekepler-backend can consume the
  # same file directly via git submodule. The director agent that
  # orchestrates the plan → animator → reviewer chain.
  workspace: ./config/workspace.yaml

  # Sub-agents the director delegates to. Auto-loaded by the CLI
  # manifest loader (see codekepler-npm PR #20).
  agents_from: ./config/agents/

  views:
    - type: panel
      name: Manim Studio
      source: ./workspace/studio.html
