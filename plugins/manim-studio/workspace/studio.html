<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manim Studio</title>
<meta name="bahulam-plugin" content="manim-studio">
<link rel="stylesheet" href="/vendor/bahulam-plugin/bahulam-plugin.css">

</head>
<body>
<div class="plugin-page">
<header class="plugin-bar"><span class="brand-mark">B</span><h1>Manim Studio</h1><span class="live-badge js-live">· connecting…</span></header>
<div class="plugin-body">
<p class="small muted mb-1" style="margin:0 0 12px">Every render the animator launches lands here when ffmpeg exits. Videos live under <span class="mono">.bahulam/tmp/manim/manim-studio/renders/</span>.</p>
<table class="plugin-table">
<thead><tr><th></th><th>Scene</th><th>Class</th><th>Render</th><th>Video</th><th>Notes</th><th>At</th></tr></thead>
<tbody id="rows"></tbody>
</table>
</div>
</div>
<script>
var token=new URLSearchParams(location.search).get('token')||'',PLUGIN='manim-studio';
function esc(s){return String(s??'').replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
async function state(op,extra){var r=await fetch('/api/plugin-state/'+PLUGIN,{method:'POST',headers:{'Content-Type':'application/json','X-Bahulam-Local-Token':token},body:JSON.stringify({op:op,...extra})});var b=await r.json();if(!r.ok||b.ok===false)throw new Error(b.error||'state op failed');return b.result}
function ft(t){return(t||'').replace('T',' ').slice(0,19)}
async function load(){var tbody=document.getElementById('rows');try{var rows=await state('list',{stream:'renders',limit:100,order:'desc'});if(!rows||!rows.length){tbody.innerHTML='<tr><td colspan="7"><div class="empty">No renders yet. Ask the agent for an animation.</div></td></tr>';return}tbody.innerHTML=rows.map(function(r){var p=r.payload||{},mark=p.status==='completed'?'✓':p.status==='failed'?'✗':'↻',s=p.status||'';return'<tr><td class="mono '+(p.status==='completed'?'muted':p.status==='failed'?'':'')+'">'+mark+'</td><td class="mono">'+esc(p.name||'')+'</td><td class="mono muted">'+esc(p.scene_class||'')+'</td><td><span class="badge '+(p.status==='completed'?'success':p.status==='failed'?'error':'warn')+'">'+esc(s)+(p.duration_s?' · '+p.duration_s+'s':'')+'</span></td><td class="mono path-text">'+esc(p.video_path||'')+'</td><td class="muted">'+esc(p.notes||'')+'</td><td class="mono muted">'+ft(r.created_at)+'</td></tr>'}).join('')}catch(e){tbody.innerHTML='<tr><td colspan="7"><div class="empty muted">'+esc(e.message)+'</div></td></tr>'}}
var _t;
var es=new EventSource('/api/events?token='+encodeURIComponent(token));
es.addEventListener('open',function(){document.querySelectorAll('.js-live').forEach(function(e){e.textContent='· live';e.classList.add('live')})});
es.addEventListener('error',function(){document.querySelectorAll('.js-live').forEach(function(e){e.textContent='· reconnecting…';e.classList.remove('live')})});
es.addEventListener('plugin_state_changed',function(ev){var d={};try{d=JSON.parse(ev.data||'{}')}catch(e){}if(d.plugin!==PLUGIN)return;clearTimeout(_t);_t=setTimeout(load,200)});
load();
</script>
</body>
</html>
