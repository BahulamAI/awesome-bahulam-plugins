<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Browser Use</title>
<meta name="bahulam-plugin" content="browser-use">

<link rel="stylesheet" href="/vendor/bahulam-plugin/bahulam-plugin.css">
<style>
/* browser-use specific */
.metrics-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}@media(max-width:500px){.metrics-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="plugin-page">
<header class="plugin-bar"><span class="brand-mark">B</span><h1>Browser Use</h1><span class="live-badge js-live">· connecting…</span></header>
<div class="plugin-body">
<div class="metrics-row">
<div class="metric"><b id="totalSessions">—</b><span>Sessions</span></div>
<div class="metric"><b id="actionsToday">—</b><span>Actions Today</span></div>
<div class="metric"><b id="activeSessions">—</b><span>Active</span></div>
</div>
<div class="section-head"><h2>Recent Sessions</h2></div>
<div class="plugin-grid" id="sessionList"><div class="empty">Loading sessions…</div></div>
</div>
</div>
<script>
(function(){var P='browser-use';
function T(){var p=new URLSearchParams(window.location.search);return p.get('token')||''}
var token=T();
async function q(op,e){var r=await fetch('/api/plugin-state/'+encodeURIComponent(P),{method:'POST',headers:{'Content-Type':'application/json','X-Bahulam-Local-Token':token},body:JSON.stringify({op:op,...e})});var b=await r.json();if(!r.ok||b.ok===false)throw new Error(b.error||'state op failed');return b.result}
function esc(s){return String(s??'').replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
function ft(t){if(!t)return'';try{return new Date(t).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}catch{return String(t)}}
var _t;
function sub(fn){var es=new EventSource('/api/events?token='+encodeURIComponent(token));es.addEventListener('open',function(){document.querySelectorAll('.js-live').forEach(function(e){e.textContent='· live';e.classList.add('live')})});es.addEventListener('error',function(){document.querySelectorAll('.js-live').forEach(function(e){e.textContent='· reconnecting…';e.classList.remove('live')})});es.addEventListener('plugin_state_changed',function(ev){var d={};try{d=JSON.parse(ev.data||'{}')}catch(e){}if(d.plugin!==P)return;if(_t)clearTimeout(_t);_t=setTimeout(fn,200)});return function(){if(_t)clearTimeout(_t);es.close()}}
async function load(){try{var rows=(await q('list',{stream:'sessions',limit:50,order:'desc'}))||[];var el=document.getElementById('sessionList');var act=rows.filter(function(s){return s.status==='active'||!s.status}).length;document.getElementById('totalSessions').textContent=String(rows.length);document.getElementById('activeSessions').textContent=String(act);if(!rows.length){el.innerHTML='<div class="empty">No browser sessions yet. Ask the agent to create one.</div>';return}el.innerHTML=rows.map(function(s){var u=s.url||s.target_url||'';return'<div class="card"><div class="flex items-center justify-between"><h3>'+esc(s.name||s.title||'Session')+'</h3><span class="badge '+(s.status==='completed'?'success':s.status==='error'?'error':'warn')+'">'+esc(s.status||'active')+'</span></div>'+(u?'<div class="meta truncate">'+esc(u)+'</div>':'')+(s.created_at?'<div class="meta">'+ft(s.created_at)+(s.updated_at?' · last: '+ft(s.updated_at):'')+'</div>':'')+'</div>'}).join('')}catch(e){document.getElementById('sessionList').innerHTML='<div class="empty">Could not load sessions.<br><small>'+esc(e.message)+'</small></div>'}}
sub(load);load()})();
</script>
</body>
</html>
