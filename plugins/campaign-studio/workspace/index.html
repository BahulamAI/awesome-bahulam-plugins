<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Campaign Studio</title>
<meta name="bahulam-plugin" content="campaign-studio">
<link rel="stylesheet" href="/vendor/bahulam-plugin/bahulam-plugin.css">
<style>
/* ── Campaign specific ── */
.metrics-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}@media(max-width:600px){.metrics-row{grid-template-columns:1fr 1fr}}
.campaign-layout{display:grid;grid-template-columns:280px 1fr;gap:14px;min-height:calc(100vh - 76px)}@media(max-width:720px){.campaign-layout{grid-template-columns:1fr}}
.aside-panel{border:1px solid var(--ws-border);border-radius:var(--ws-radius-md);background:var(--ws-panel);overflow:hidden}
.aside-panel h2{margin:0;padding:10px 12px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ws-faint);border-bottom:1px solid var(--ws-border-subtle)}
.aside-content{padding:12px}
.aside-content label{display:block;font-size:11px;color:var(--ws-muted);margin:0 0 10px}.aside-content label span{display:block;margin-bottom:3px}
.aside-content input,.aside-content textarea,.aside-content select{width:100%;border:1px solid var(--ws-border);border-radius:var(--ws-radius-sm);padding:5px 7px;background:var(--ws-panel);font:12px var(--mono);color:var(--ws-fg);outline:none}
.aside-content input:focus,.aside-content textarea:focus{border-color:var(--ws-primary);box-shadow:0 0 0 2px var(--ws-primary-soft)}
.aside-content textarea{min-height:52px;resize:vertical;font-size:11px}
.aside-content .btn{margin-top:4px;width:100%;justify-content:center}
.aside-content .btn+.btn{margin-top:4px}
.campaign-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:600px){.campaign-grid{grid-template-columns:1fr}}
.campaign-panel{border:1px solid var(--ws-border);border-radius:var(--ws-radius-md);background:var(--ws-panel);overflow:hidden}
.campaign-panel h2{margin:0;padding:10px 12px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ws-faint);border-bottom:1px solid var(--ws-border-subtle)}
.panel-body{padding:10px}
.item{border:1px solid var(--ws-border-subtle);border-radius:var(--ws-radius-sm);padding:8px;margin-bottom:6px;background:var(--ws-panel)}.item:last-child{margin-bottom:0}
.item strong{display:block;font-size:12px;font-weight:600}.item small{color:var(--ws-muted);font-size:11px}
.status{font-size:11px;color:var(--ws-muted);padding:6px 0}.status.error{color:var(--ws-error)}
</style>
</head>
<body>
<div class="plugin-page">
<header class="plugin-bar"><span class="brand-mark">B</span><h1>Campaign Studio</h1><span class="live-badge js-live">· connecting…</span></header>
<div class="plugin-body compact">
<div class="metrics-row">
<div class="metric"><b id="mCampaigns">0</b><span>Campaigns</span></div>
<div class="metric"><b id="mVariants">0</b><span>Variants</span></div>
<div class="metric"><b id="mPosts">0</b><span>Posts</span></div>
<div class="metric"><b id="mMetrics">—</b><span>Activity</span></div>
</div>
<div class="campaign-layout">
<aside>
<div class="aside-panel">
<h2>New Campaign</h2>
<div class="aside-content">
<label><span>Name</span><input id="name" value="Bahulam vNext Launch"></label>
<label><span>Objective</span><textarea id="objective">Introduce Bahulam plugins as outcome runtimes, not prompt packs.</textarea></label>
<label><span>Audience</span><input id="audience" value="engineering leaders and AI builders"></label>
<label><span>Offer</span><input id="offer" value="install a multi-agent campaign workflow"></label>
<label><span>Channels</span><input id="channels" value="x,linkedin,email"></label>
<button class="btn primary" id="create">Create Campaign</button>
<button class="btn" id="variants">Create Variants</button>
<button class="btn" id="schedule">Schedule Posts</button>
<button class="btn" id="report">Build Report</button>
<div class="status" id="status"></div>
</div>
</div>
</aside>
<main>
<div class="campaign-grid">
<section class="campaign-panel"><h2>Campaigns</h2><div class="panel-body"><div id="campaigns"></div></div></section>
<section class="campaign-panel"><h2>Variants</h2><div class="panel-body"><div id="variantsList"></div></div></section>
<section class="campaign-panel"><h2>Posts</h2><div class="panel-body"><table class="plugin-table"><thead><tr><th>Channel</th><th>Status</th><th>URL</th></tr></thead><tbody id="posts"></tbody></table></div></section>
<section class="campaign-panel"><h2>Activity</h2><div class="panel-body"><div id="activity"></div></div></section>
</div>
</main>
</div>
</div>
</div>
<script>
const token = new URLSearchParams(location.search).get('token') || '';
const PLUGIN = 'campaign-studio';
let activeCampaignId = null;
function esc(s){return String(s??'').replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
async function tool(name,args){
  const res=await fetch('/api/tools/execute',{method:'POST',headers:{'Content-Type':'application/json','X-Bahulam-Local-Token':token},body:JSON.stringify({name,args})});
  const body=await res.json();
  if(!res.ok||body.ok===false)throw new Error(body.error||body.message||'request failed');
  const r=body.result;
  if(r&&r.success===false)throw new Error(String(r.output));
  return r&&r.output!==undefined?r.output:r;
}
async function state(op,extra={}){
  const res=await fetch('/api/plugin-state/'+PLUGIN,{method:'POST',headers:{'Content-Type':'application/json','X-Bahulam-Local-Token':token},body:JSON.stringify({op,...extra})});
  const body=await res.json();
  if(!res.ok||body.ok===false)throw new Error(body.error||'state request failed');
  return body.result||body;
}
function setStatus(msg,err){var el=document.getElementById('status');el.textContent=msg;el.className='status'+(err?' error':'')}
function item(html){var d=document.createElement('div');d.className='item';d.innerHTML=html;return d}
async function load(){
  try{
    var campaigns=(await tool('list_campaigns',{limit:20})).rows||[];
    activeCampaignId=activeCampaignId||campaigns[0]?.id||null;
    var variants=activeCampaignId?(await tool('list_variants',{campaign_id:activeCampaignId,limit:100})).rows||[]:[];
    var posts=activeCampaignId?(await tool('list_posts',{campaign_id:activeCampaignId,limit:100})).rows||[]:[];
    document.getElementById('mCampaigns').textContent=campaigns.length;
    document.getElementById('mVariants').textContent=variants.length;
    document.getElementById('mPosts').textContent=posts.length;
    var c=document.getElementById('campaigns');c.innerHTML='';
    campaigns.forEach(function(x){c.appendChild(item('<strong>'+esc(x.name)+'</strong><small>'+esc(String(x.objective||'').slice(0,120))+'</small><br><span class="badge '+(x.status==='active'?'primary':x.status==='completed'?'success':'warn')+'">'+esc(x.status)+'</span>'))});
    var v=document.getElementById('variantsList');v.innerHTML='';
    variants.forEach(function(x){v.appendChild(item('<strong>'+esc(x.channel)+': '+esc(String(x.headline||'').slice(0,80))+'</strong><small>'+esc(String(x.body||'').slice(0,140))+'</small><br><span class="badge '+(x.status==='approved'?'success':x.status==='draft'?'warn':'primary')+'">'+esc(x.status)+'</span>'))});
    var p=document.getElementById('posts');p.innerHTML='';
    posts.forEach(function(x){var tr=document.createElement('tr');tr.innerHTML='<td>'+esc(x.channel)+'</td><td><span class="badge '+(x.status==='scheduled'?'warn':x.status==='posted'?'success':'primary')+'">'+esc(x.status)+'</span></td><td><code>'+esc(x.url||'')+'</code></td>';p.appendChild(tr)});
    var activity=(await state('list',{stream:'campaign_activity',limit:20,order:'desc'}))||[];
    var rows=Array.isArray(activity)?activity:activity.rows||[];
    var a=document.getElementById('activity');a.innerHTML='';
    rows.forEach(function(x){a.appendChild(item('<strong>'+esc(x.payload?.type||'event')+'</strong><small>'+(x.created_at?new Date(x.created_at).toLocaleString():'')+'</small>'))});
    document.getElementById('mMetrics').textContent=String(rows.length);
  }catch(e){setStatus(e.message,true)}
}
document.getElementById('refresh').onclick=load;
document.getElementById('create').onclick=function(){setStatus('creating…');tool('campaign_create',{name:name.value,objective:objective.value,audience:audience.value,offer:offer.value,channels:channels.value.split(',')}).then(function(out){activeCampaignId=out.campaign_id;setStatus('Campaign created');load()}).catch(function(e){setStatus(e.message,true)})};
document.getElementById('variants').onclick=function(){setStatus('generating variants…');tool('copy_variant_create',{campaign_id:activeCampaignId,channels:channels.value.split(','),tone:'pragmatic'}).then(function(){setStatus('Variants created');load()}).catch(function(e){setStatus(e.message,true)})};
document.getElementById('schedule').onclick=function(){setStatus('scheduling…');tool('post_schedule',{campaign_id:activeCampaignId,landing_url:'https://bahulam.ai/plugins'}).then(function(){setStatus('Posts scheduled');load()}).catch(function(e){setStatus(e.message,true)})};
document.getElementById('report').onclick=function(){setStatus('building report…');tool('campaign_report',{campaign_id:activeCampaignId}).then(function(r){setStatus(r?.recommendation||'Report built');load()}).catch(function(e){setStatus(e.message,true)})};
(function(){var es=new EventSource('/api/events?token='+encodeURIComponent(token));es.addEventListener('open',function(){document.querySelectorAll('.js-live').forEach(function(e){e.textContent='· live';e.classList.add('live')})});es.addEventListener('error',function(){document.querySelectorAll('.js-live').forEach(function(e){e.textContent='· reconnecting…';e.classList.remove('live')})});es.addEventListener('plugin_state_changed',function(ev){var d={};try{d=JSON.parse(ev.data||'{}')}catch(e){}if(!d.plugin||d.plugin===PLUGIN)load()})})();
load();
</script>
</body>
</html>
