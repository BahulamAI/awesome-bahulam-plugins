apiVersion: bahulam.plugin/1
kind: Plugin
metadata:
  name: research-studio
  version: 0.1.0
  description: >
    Research Studio — web search + fetch (from pi-web-access) paired with
    a persistent research-notes store. The agent searches, reads, and
    saves findings as citations; the workspace panel renders the growing
    notebook live as the agent works.
  author: BahulamAI
  repository: https://github.com/BahulamAI/awesome-bahulam-plugins

spec:
  # Native tools — the persistent notebook over pi-web-access's stateless
  # search/fetch. Each saved finding becomes a citation the agent (and
  # future turns) can recall without re-searching.
  tools:
    - name: save_finding
      description: >
        Persist a research finding to the studio notebook — a title, the
        source URL, a short excerpt, and a topic tag. Use after any
        fetch_content or web_search result that actually informs the
        answer. The workspace panel and future turns see it immediately.
      tool: ./tools/save-finding.mjs
      parameters:
        type: object
        properties:
          topic:   { type: string, description: "Research topic / question this finding relates to" }
          title:   { type: string, description: "Source page title or a short headline" }
          url:     { type: string, description: "Canonical URL" }
          excerpt: { type: string, description: "One-paragraph excerpt or your summary of the source's claim" }
          notes:   { type: string, description: "Your analyst note — why this source matters, caveats, confidence" }
        required: [topic, title, url]

    - name: list_findings
      description: >
        Read persisted research findings from the notebook. Use this first
        when the user asks about a topic already researched, before
        re-searching the web.
      tool: ./tools/list-findings.mjs
      parameters:
        type: object
        properties:
          topic: { type: string, description: "Filter by topic tag (exact match). Omit for all." }
          limit: { type: integer, description: "Max rows, default 50" }
        required: []

    - name: drop_finding
      description: Remove a persisted finding by its id.
      tool: ./tools/drop-finding.mjs
      parameters:
        type: object
        properties:
          id: { type: integer, description: "Finding id (from list_findings)" }
        required: [id]

  # Composed pi tools — the actual web/search/fetch layer.
  composes:
    - source: pi:pi-web-access@^0.27.0
      as: web
      expose:
        - web_search
        - source_check
        - fetch_content
        - get_search_content
      verified: true

  agents:
    - slug: research-analyst
      name: Research Analyst
      role: specialist
      description: >
        Investigates topics using web search + fetch, and builds a
        persistent, cited notebook of findings that survives across turns
        and populates the workspace panel.
      tools:
        # Native (persistent notebook)
        - save_finding
        - list_findings
        - drop_finding
        # Composed pi-web-access (web search + fetch)
        - web__web_search
        - web__source_check
        - web__fetch_content
        - web__get_search_content
      system_prompt: |
        You are the Research Analyst. Your job is to investigate a topic
        using web sources and build a durable, cited notebook the user
        can browse.

        Standard workflow for a new research question:
        1. Call `list_findings` first with the topic — if we've already
           researched it, summarize existing findings before searching
           again. Don't repeat expensive web work.
        2. Call `web__web_search` for the current query. Note the top
           2-3 promising URLs.
        3. Call `web__fetch_content` on those URLs to get readable content
           as markdown.
        4. For any claim that meaningfully informs your answer, call
           `save_finding` with topic, title, URL, excerpt, and a short
           analyst note (why the source matters, its caveats).
        5. Answer the user with citations formatted as `[title](url)`
           and reference the saved findings by their notebook position.

        Rules:
        - Every claim in your answer must trace to a saved finding OR to
          a fetched source in the current turn. No unsupported claims.
        - Prefer primary sources (docs, spec pages, official blogs) over
          aggregators. Note when a source is second-hand.
        - `save_finding` is cheap and reversible; save generously. The
          user can drop findings via the panel or `drop_finding`.
        - `source_check` is for adversarial verification of a specific
          claim; use it when the user challenges a finding or asks "is
          this true?".

  workspace:
    views:
      - type: panel
        name: Research Notebook
        source: ./workspace/notebook.html
